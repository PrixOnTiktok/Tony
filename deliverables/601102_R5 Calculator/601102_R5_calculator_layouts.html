<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T601 Car Frame Calculator</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#15191e; --muted:#5b6672; --line:#e2e6eb; --line2:#cdd3da;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --input:#fff; --input-line:#b9c3cf;
  --calc:#fff7e3; --ok:#18794e; --ok-soft:#e3f5ea; --bad:#c0261c; --bad-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff3cf;
  --steel:#6b7785; --jack:#2f6fd6; --piston:#a9c8f5; --brass:#b98235; --orange:#e8590c;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --card:#181c22; --ink:#e8ebef; --muted:#9ba6b2; --line:#2a3038; --line2:#3a424c;
  --accent:#73a7f2; --accent-soft:#1b2a40; --input:#12161b; --input-line:#46505c;
  --calc:#2a2414; --ok:#5fd08a; --ok-soft:#14291c; --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c14e; --warn-soft:#33290f;
  --steel:#8d99a8; --jack:#5a92ea; --piston:#2f5590; --brass:#c9944a;
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --card:#181c22; --ink:#e8ebef; --muted:#9ba6b2; --line:#2a3038; --line2:#3a424c;
  --accent:#73a7f2; --accent-soft:#1b2a40; --input:#12161b; --input-line:#46505c;
  --calc:#2a2414; --ok:#5fd08a; --ok-soft:#14291c; --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c14e; --warn-soft:#33290f;
  --steel:#8d99a8; --jack:#5a92ea; --piston:#2f5590; --brass:#c9944a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;font-size:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
button.ghost{border-color:transparent;background:transparent}
button.small{font-size:13px;padding:4px 10px;min-height:30px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.xl{display:none!important}
body.xl .xl{display:revert!important}
body.xl span.xl,body.xl code.xl{display:inline!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.app{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand img{height:42px;background:#fff;border-radius:8px;padding:2px;border:1px solid var(--line)}
.brand h1{margin:0;font-size:18px;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted)}
.job{display:flex;gap:8px;flex:1;min-width:260px;justify-content:flex-end;flex-wrap:wrap}
.job label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.job input{font:600 14px system-ui,sans-serif;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);width:200px;text-transform:none;letter-spacing:0}
.job input.short{width:110px}
.menu{display:flex;gap:6px;flex-wrap:wrap}
nav.layouts{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:12px 0 0}
.tabs{display:flex;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tabs button{border:0;background:transparent;white-space:nowrap;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:650;min-height:34px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs .star{color:#f0a400} .tabs button[aria-selected="true"] .star{color:#ffe08a}
.mkdef{font-size:13px}
.mkdef.is{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.laydesc{font-size:13px;color:var(--muted);margin:6px 2px 12px}

/* status strip */
.status{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0;margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:650;border:1px solid;cursor:pointer;min-height:32px;background:var(--card)}
.chip .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)} .chip.ok .ic{background:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)} .chip.bad .ic{background:var(--bad)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)} .chip.warn .ic{background:var(--warn)}
.chip.info{border-color:var(--line2);color:var(--ink)} .chip.info .ic{background:var(--accent)}
.chip b{font-family:var(--mono);font-weight:700}
.probs{display:grid;gap:8px;margin:8px 0 4px}
.prob{border:1px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:9px 12px;display:grid;gap:6px}
.prob.warn{border-color:var(--warn);background:var(--warn-soft)}
.prob .pt{font-weight:650}
.prob .pt::before{content:"✕";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:8px;vertical-align:1px}
.prob.warn .pt::before{content:"!";background:var(--warn)}
.prob .ps{font:11.5px var(--mono);color:var(--muted)}
.prob .fx{display:flex;gap:6px;flex-wrap:wrap}
.prob .fx button{font-size:13px;padding:5px 10px;min-height:32px;background:var(--card)}
.prob .fx button.apply{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.all{background:var(--ok-soft)} .probwrap{margin:0 0 10px}

/* cards & groups */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card h2{margin:0 0 2px;font-size:16px}
.card .lead{margin:0 0 10px;font-size:13px;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.grp-h .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 12px var(--mono)}

/* field */
.fld{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.fld:first-of-type{border-top:0}
.fld .lab{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.badge{font:800 12px var(--mono);min-width:28px;height:22px;padding:0 5px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.fld .hint{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.35}
.fld .ctl{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:4px}
.fld .ctl input{width:92px;text-align:right;font:700 16px var(--mono);padding:7px 9px;border-radius:9px;border:1.5px solid var(--input-line);background:var(--input);color:var(--ink);min-height:40px}
.fld .ctl input:focus{border-color:var(--accent)}
.fld.err .ctl input{border-color:var(--bad);background:var(--bad-soft)}
.fld .u{font-size:13px;color:var(--muted);min-width:20px}
.step{width:34px;min-width:34px;height:40px;padding:0;font-size:18px;line-height:1;border-radius:9px;color:var(--muted)}
.fld .sub2{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.fld .ftin{font:12px var(--mono);color:var(--muted)}
.fld .msg{color:var(--bad);font-weight:650}
.fld .msg.soft{color:var(--warn)}
.fld .rec{font-size:12.5px;padding:2px 9px;min-height:28px;border-style:dashed}
.fld.hl,.res.hl{background:color-mix(in srgb,var(--orange) 9%,transparent);border-radius:8px}
.fld .xl{font:11px var(--mono);color:var(--muted)}

/* results */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:8px 2px;border-top:1px solid var(--line);align-items:baseline}
.res:first-of-type{border-top:0}
.res .rl{font-size:14px;min-width:0;display:flex;gap:7px;align-items:baseline}
.res .rl .badge{transform:translateY(-1px)}
.res .rv{font:700 16px var(--mono);text-align:right;white-space:nowrap}
.res .rv .u{font:400 12.5px system-ui,sans-serif;color:var(--muted);margin-left:3px}
.res .rv small{display:block;font:11.5px var(--mono);color:var(--muted)}
.res.bad .rv{color:var(--bad)} .res.okc .rv{color:var(--ok)}
.res .how{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:3px;display:none}
.res .how code{font-size:11.5px;color:var(--accent)}
.res.open .how{display:block}
.res .q{border:0;background:none;padding:0 2px;min-height:0;color:var(--muted);font-size:13px;cursor:pointer}
.res .q:hover{color:var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rgrid .card+.card{margin-top:0}
.rgrid h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.jackline{font-weight:700;color:var(--accent);font-size:14px;margin:2px 0 6px}

/* drawing viewer */
.viewer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.vbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
.vstyle{display:flex;align-items:center;gap:6px}
.vstyle .ib{width:36px;padding:0;font-size:20px;line-height:1}
.vname{font-weight:700;min-width:104px;text-align:center}
.vdots{display:flex;gap:4px}
.vdots i{width:7px;height:7px;border-radius:50%;background:var(--line2);cursor:pointer}
.vdots i.on{background:var(--accent)}
.vdef{font-size:12.5px;padding:3px 9px;min-height:30px}
.vdef.is{color:var(--ok);border-color:transparent;background:none;cursor:default}
.vpos{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;flex-wrap:wrap}
.vpos button{border:0;background:none;font-size:12.5px;padding:4px 9px;min-height:30px;border-radius:7px;color:var(--muted);font-weight:600}
.vpos button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.vpos button.play{color:var(--accent)}
.vcanvas{position:relative}
.vcap{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* popover */
#pop{position:absolute;z-index:50;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;width:min(340px,calc(100vw - 24px))}
#pop .fld{border:0;padding:4px 0}
#pop h4{margin:0 0 4px;font-size:15px}
#pop p{margin:4px 0;font-size:13px;color:var(--muted)}
#pop .x{position:absolute;top:6px;right:6px;border:0;background:none;font-size:18px;min-height:0;padding:2px 6px;color:var(--muted)}

/* layout grids */
.split{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
.stick{position:sticky;top:64px}
.viewer .hw{max-height:calc(100vh - 140px)}
.keyres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.kr{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.kr small{display:block;color:var(--muted);font-size:12px}
.kr b{font:700 17px var(--mono)} .kr .u{font-size:12px;color:var(--muted)}
.kr.bad{border-color:var(--bad);background:var(--bad-soft)} .kr.bad b{color:var(--bad)}
.kr.ok b{color:var(--ok)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px;gap:10px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:18px}

/* guided */
.gd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 12px;overflow-x:auto}
.steps li{flex:1;min-width:max-content}
.steps button{width:100%;display:flex;align-items:center;gap:8px;border-radius:10px;font-weight:650;color:var(--muted);justify-content:flex-start}
.steps .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font:700 12px var(--mono);flex:none}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.steps button[aria-current="step"] .sn{background:var(--accent);color:#fff}
.steps .done .sn{background:var(--ok);color:#fff}
.steps .bad .sn{background:var(--bad);color:#fff}
.gd h2.q{font-size:22px;margin:0 0 4px}
.gd .navb{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.gd .navb button{padding:10px 18px;font-size:15px}
.chk{width:100%;border-collapse:collapse;font-size:14px}
.chk td,.chk th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.chk td.v{font:700 14px var(--mono);white-space:nowrap}
.chk button{font-size:13px;padding:2px 8px;min-height:28px}

/* drawing-first */
.df{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}
.df .viewer .hw{max-height:calc(100vh - 190px)}
.sel h3{margin:0 0 4px;font-size:18px}
.sel p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.elist .fld{padding:7px 0}
.elist .fld .hint{display:none}
.elist .fld .ctl input{width:80px;font-size:15px;min-height:36px}
.elist .step{height:36px;width:30px;min-width:30px}

/* dashboard */
.db{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.db .inp .fld .hint{display:none}
.db .inp .fld .ctl input{width:82px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.tile h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.tile .big{font:800 28px/1.15 var(--mono)} .tile .big .u{font:500 14px system-ui,sans-serif;color:var(--muted);margin-left:4px}
.tile .sm{font-size:12.5px;color:var(--muted)}
.tile.st{border-width:2px}
.tile.st.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)} .tile.st.ok .big{color:var(--ok)}
.tile.st.bad{border-color:var(--bad);background:var(--bad-soft)} .tile.st.bad .big{color:var(--bad)}
.tile .stt{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;text-transform:none;letter-spacing:0}
.tile.ok .stt{background:var(--ok-soft);color:var(--ok)} .tile.bad .stt{background:var(--bad);color:#fff}
.meter{height:8px;border-radius:9px;background:var(--line);margin:8px 0 4px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:9px}
.tile.bad .meter i{background:var(--bad)}
.tile.wide{grid-column:span 2}
.tile .viewer{border:0;box-shadow:none;padding:0}

/* table */
.tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line2);background:var(--card)}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.sec td{background:var(--bg);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.tbl td.v{width:150px}
.tbl td.v .ctl{display:flex;gap:4px;align-items:center}
.tbl td.v input{width:84px;text-align:right;font:700 15px var(--mono);padding:6px 8px;border-radius:8px;border:1.5px solid var(--input-line);background:var(--input);color:var(--ink)}
.tbl tr.err td.v input{border-color:var(--bad);background:var(--bad-soft)}
.tbl td.out{font:700 15px var(--mono);text-align:right;background:var(--calc);white-space:nowrap}
.tbl td.rng{font-size:12.5px;color:var(--muted)}
.tbl td.st{white-space:nowrap;font-weight:700;font-size:13px}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)} .st-warn{color:var(--warn)}
.tbl tr.hl td{background:color-mix(in srgb,var(--orange) 9%,transparent)}
.tbl td.how{font-size:12.5px;color:var(--muted)}

/* what-if */
.wi{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.sl{padding:9px 0;border-top:1px solid var(--line)}
.sl:first-of-type{border-top:0}
.sl .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sl .top .lab{font-weight:650;display:flex;gap:8px;align-items:center;font-size:14px}
.sl .top input{width:86px;text-align:right;font:700 15px var(--mono);padding:5px 8px;border-radius:8px;border:1.5px solid var(--input-line);background:var(--input);color:var(--ink)}
.sl .delta{font:12px var(--mono);color:var(--muted);min-width:56px;text-align:right}
.sl input[type=range]{width:100%;margin:8px 0 2px;-webkit-appearance:none;appearance:none;background:transparent;height:26px}
.sl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:var(--track,var(--line))}
.sl input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--track,var(--line))}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.sl .ends{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;margin:0 0 6px}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:1px;margin-right:5px}
.dd{font:12px var(--mono)} .dd.up{color:var(--ok)} .dd.dn{color:var(--bad)}

/* report */
.rpbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.paper{--card:#fff;--ink:#111;--muted:#5a6470;--line:#dde1e6;--line2:#c4cad1;--accent:#1f4e99;--accent-soft:#eaf0fa;--bg:#f4f6f8;--ok:#18794e;--ok-soft:#e3f5ea;--bad:#b42318;--bad-soft:#fdecea;--warn:#8a5a00;--warn-soft:#fff3cf;--input:#fff;--input-line:#c4cad1;--calc:#fff8e6;--steel:#6b7785;--jack:#2f6fd6;--piston:#a9c8f5;--brass:#b98235;
  background:#fff;color:#111;max-width:880px;margin:0 auto;padding:34px 40px;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.16)}
.rp-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;border-bottom:3px solid #111;padding-bottom:10px}

// Every value is keyed by its original Excel cell. Blank input = 0, like Excel.

const STROKES = [["A73",41],["A75",67],["A77",93],["A79",120],["A81",147],["A83",174],["A86",201],["A88",228],["A90",252]];

/* =====================================================================

     piston (plunger) top = (M + R + Q) − (D+E+B − f) / 2

  const v = k => (typeof c[k]==="number" && isFinite(c[k])) ? c[k] : 0;

  const N=v("E43"),M=v("E41"),R=v("E63"),Q=v("E61"),S=v("E65"),L=v("E39");
  const fMin=D-A, fBot=D, fTop=D+E, fMax=D+E+B, full=M+R+Q;
  return {A,B,C,D,E,F,X,G,H,N,M,R,Q,S,L,fMin,fBot,fTop,fMax,full, cyl:M+R, line:fMax-C+L,
    rail:v("E49"), O:v("E45"), P:v("E47"), nb:v("E51"), T:v("E31"), T2:v("E33"), ok: c.E21>0,
    at(f){ return {f, plank:f-C, cabTop:f-C+F, frameTop:f-C+L, uni:f-C+X, plunger:Math.max(M+R, full-(fMax-f)/2)}; }};
}
const POS = [
  {id:"buffer", name:"On buffer",       f:g=>g.fMin},
  {id:"bottom", name:"Bottom floor",    f:g=>g.fBot},
  {id:"top",    name:"Top floor",       f:g=>g.fTop},
  {id:"rung",   name:"Piston rung out", f:g=>g.fMax},
];
const carF = (g,o) => o.f!=null ? o.f : (POS.find(p=>p.id===o.pos)||POS[1]).f(g);
const sh = v => num(v,2).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");
const inch = v => sh(v)+"″";

// Plain-language glossary used for tooltips on every drawing.
const GLOSS = {
  pit:   ["Pit", "The recess below the bottom floor. It holds the jack pillar, the buffer and the bottom of the car frame."],
  floor: ["Landing", "A floor the elevator stops at. The bottom and top landings are E (travel) apart."],
  ceil:  ["Ceiling / overhead", "The underside of the structure above the top landing. G is measured from the top floor up to here."],
  wall:  ["Hoistway wall", "The shaft the elevator runs in."],
  cab:   ["Cab", "The enclosure passengers ride in. F is its height from the car-frame plank to its highest point."],
  plat:  ["Platform (C)", "The car floor, including the finished floor surface, sitting on the plank."],
  frame: ["Car frame (T601 sling)", "Steel cantilever frame that carries the cab: plank arms under the platform and stiles that run on the guide rails. The ropes pick it up at shackles on the plank."],
  uni:   ["Mounting bracket (X)", "Top unistrut that ties the cab to the car-frame upright, X above the plank. X ≥ 90.5″ needs the 8 ft frame."],
  pillar:["Pillar (M)", "Square steel tube in the pit that the jack cylinder stands on, cut to length M so the sheave ends up at the right height."],
  cyl:   ["Jack cylinder (R)", "The hydraulic cylinder. R is its collapsed length (stroke + 8″)."],
  plunger:["Piston / plunger (Q)", "Pushed up by oil. With 2:1 roping it only has to move half as far as the car."],
  sheave:["Sheave assembly (15″)", "12″ rope pulley in a frame bolted to the top of the piston, guided on the same rails as the car. The assembly is about 15″ tall."],
  rope:  ["Ropes (2 × 3/8″)", "Each rope is fixed at the dead-end hitch on the pit floor, runs up over the sheave and down to the shackles on the car-frame plank. Roped 2:1, so the car travels twice as far as the piston."],
  deh:   ["Dead-end hitch", "Where the fixed end of the ropes is anchored, on the pit floor beside the jack."],
  rail:  ["Guide rail", "Steel rail the car frame and jack are guided by. It runs from the pit floor to 5″ above the sheave."],
  brk:   ["Rail brackets", "Fix the rail to the wall, at most 60″ apart. Exact positions are set on site; spacing here is illustrative."],
  O:     ["Pillar bracket (O)", "Ties the pillar to the rail, O above the pit floor."],
  P:     ["Jack bracket (P)", "Ties the top of the jack cylinder to the rail, P above the pit floor."],
  person:["Person (5′9″)", "Shown for scale only."],
};
const tip = id => GLOSS[id] ? `<title>${esc(GLOSS[id][0]+" — "+GLOSS[id][1])}</title>` : "";
const DIMTIP = {E17:"A · Bottom under travel: how far the car can go below the bottom floor before resting on the buffer",
  E18:"B · Top over travel: how far the car can go above the top floor",E19:"C · Platform thickness incl. finished floor",
  E20:"D · Pit depth",E21:"E · Travel, bottom floor to top floor",E22:"F · Cab height, plank to highest point of cab",
  E24:"G · Overhead, top floor to ceiling",E25:"H · Clearance between car frame and sheave with the piston rung out",
  E31:"T · Sheave overhead clearance (min 6″ by code)",E33:"T2 · Cab overhead clearance (min 6″ by code)",
  E35:"J · Top of piston above the top floor, rung out",E37:"K · Top of piston above the finished cab floor, rung out",
  E39:"L · Top of piston above the car-frame plank, rung out",E41:"M · Pillar height",E43:"N · Total hoistway",
  E45:"O · Pillar bracket height from pit floor",E47:"P · Jack bracket height from pit floor",E61:"Q · Jack stroke selected",
  E63:"R · Collapsed length of jack",E65:"S · Piston extension for roping",E49:"Total rail length"};

function svgOpen(W,H,cls,label){ return `<svg viewBox="0 0 ${W} ${H}" style="--fs:${FS.toFixed(2)}" class="hw ${cls}" role="img" aria-label="${esc(label)}" preserveAspectRatio="xMidYMid meet">`; }
function emptySVG(W,H,cls,msg){ return svgOpen(W,H,cls,msg)+`<rect class="bg" width="${W}" height="${H}"/><text class="t mut" x="${W/2}" y="${H/2}" text-anchor="middle">${esc(msg)}</text></svg>`; }
function scaleFor(g, H, top, bot, extraHi=0){
  const lo = Math.min(0, g.fMin-g.C-8);
  const hi = Math.max(g.N, g.full+15, g.rail, g.fMax-g.C+Math.max(g.F,g.L), 1) + extraHi;
  const k = (H-top-bot)/(hi-lo);
  return {k, lo, hi, Y:v=>H-bot-(v-lo)*k};
}
// push labels apart (bottom-up) so they never overlap
let FS=1; // label scale so text stays readable when the drawing is shown small
function spread(items, gap, lo=-1e9, hi=1e9){
  gap*=FS;
  const s=[...items].sort((a,b)=>b.y-a.y);
  s.forEach(i=>i.ly=Math.min(hi,Math.max(lo,i.y)));
  for (let i=1;i<s.length;i++) if (s[i].ly > s[i-1].ly-gap) s[i].ly = s[i-1].ly-gap;
  if (s.length && s[s.length-1].ly < lo){ s[s.length-1].ly = lo; for (let i=s.length-2;i>=0;i--) if (s[i].ly < s[i+1].ly+gap) s[i].ly = s[i+1].ly+gap; }
  return items;
}
// vertical dimension chain: segs [{a,b,l,v,cell,bad}] in inches
function dimChain(Y, x, segs, side, gap=17){
  const items = spread(segs.filter(Boolean).map(s=>({...s, y:(Y(s.a)+Y(s.b))/2})), gap);
  return items.map(s=>{
    const y1=Y(s.a), y2=Y(s.b), tx = side==="r" ? x+8 : x-8, an = side==="r" ? "start" : "end";
    const lead = Math.abs(s.ly-s.y)>3 ? `<path class="lead" d="M${x} ${s.y} L${tx+(side==="r"?-3:3)} ${s.ly-4}"/>` : "";
    return `<g class="dim${s.bad?" bad":""}" data-cell="${s.cell||""}"><title>${esc(DIMTIP[s.cell]||s.l)}</title>
      <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><path class="tick" d="M${x-5} ${y1+5}L${x+5} ${y1-5}M${x-5} ${y2+5}L${x+5} ${y2-5}"/>${lead}
      <text class="t" x="${tx}" y="${s.ly+4.5}" text-anchor="${an}"><tspan class="dl">${s.l}</tspan> ${s.v}</text></g>`;
  }).join("");
}

/* ---------------- 1 · technical / blueprint / sketch ---------------- */
function paintLine(c, o){
  const sty = o.style, W=760, H=980, g=hoistGeo(c), cls=`hw-${sty}`;
  if (!g.ok) return emptySVG(W,H,cls,"Enter the travel (E) to draw the hoistway");
  const {Y,k} = scaleFor(g,H,40,34);
  const f=carF(g,o), cur=g.at(f), gh=g.at(g.fMax), showGhost = o.ghost!==false && f<g.fMax-0.01;
  const x = {N:20, DEG:92+(FS-1)*40, s0:108, face:176, AB:188, c0:212, c1:396, F:384, J:240, K:286, L:332, u0:440, u1:452, jx:500, rail:540, w0:560, w1:580, R:610};
  const r = Math.max(9, Math.min(18, 7.5*k)), sq = (v)=>Math.max(1,v);
  let s = "";
  s += `<defs>
    <pattern id="hatch-${sty}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" class="conc-bg"/><line x1="0" y1="0" x2="0" y2="9" class="conc-ln"/></pattern>
    <filter id="rough-${sty}"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
    <pattern id="grid-${sty}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="gridln"/></pattern>
  </defs><rect class="bg" width="${W}" height="${H}"/>${sty!=="technical"?`<rect width="${W}" height="${H}" fill="url(#grid-${sty})"/>`:""}`;
  s += `<g ${sty==="sketch"?`filter="url(#rough-${sty})"`:""}>`;
  const conc = (x1,y1,w,h,id="wall") => `<rect class="conc" x="${x1}" y="${y1}" width="${sq(w)}" height="${sq(h)}" fill="url(#hatch-${sty})">${tip(id)}</rect>`;
  // structure
  s += conc(x.s0, Y(0), x.w1-x.s0, 18, "pit");
  s += conc(x.s0, Y(g.D), x.face-x.s0, Y(0)-Y(g.D), "pit");
  s += conc(x.w0, Y(g.N)-16, x.w1-x.w0, Y(0)-Y(g.N)+16);
  s += conc(x.face-16, Y(g.N)-16, x.w0-x.face+16, 16, "ceil");
  s += conc(x.s0, Y(g.fTop), x.face-x.s0, 12, "floor");
  // front wall between door openings (doors 84″ high, illustrative)
  const dh=84, fw = (a,b) => b>a ? conc(x.face-10, Y(b), 10, Y(a)-Y(b)) : "";
  s += fw(g.D+dh, g.fTop) + fw(g.fTop+dh, g.N);
  s += `<text class="t xs mut" x="${x.s0+3}" y="${Y(g.D)+16}">BOTTOM FLOOR</text><text class="t xs mut" x="${x.s0+3}" y="${Y(g.fTop)+25}">TOP FLOOR</text>`;
  s += `<line class="lvl" x1="${x.face}" y1="${Y(g.D)}" x2="${x.w0}" y2="${Y(g.D)}"/><line class="lvl" x1="${x.face}" y1="${Y(g.fTop)}" x2="${x.w0}" y2="${Y(g.fTop)}"/>`;
  // rail + brackets
  s += `<g class="part" data-part="rail"><rect class="rail" x="${x.rail-3}" y="${Y(g.rail)}" width="6" height="${sq(Y(0)-Y(g.rail))}"/>${tip("rail")}</g>`;
  const n = Math.max(0, Math.round(g.nb));
  for (let i=0;i<n;i++){ const h = n>1 ? 6+(g.rail-12)*i/(n-1) : g.rail/2; s += `<g class="part">${tip("brk")}<rect class="brk" x="${x.rail+3}" y="${Y(h)-2}" width="${x.w0-x.rail-3}" height="4"/></g>`; }
  // ghost (piston rung out)
  if (showGhost){
    s += `<g class="ghost"><rect x="${x.c0}" y="${Y(gh.cabTop)}" width="${x.c1-x.c0}" height="${sq(Y(gh.plank)-Y(gh.cabTop))}"/>
      <path d="M${x.c0-4} ${Y(gh.plank)}H${x.u1}V${Y(gh.frameTop)}H${x.u0}V${Y(gh.plank)-6}H${x.c0-4}Z"/>
      <rect x="${x.jx-7}" y="${Y(g.full)}" width="14" height="${sq(Y(cur.plunger)-Y(g.full))}"/><rect x="${x.jx-21}" y="${Y(g.full+15)}" width="42" height="${sq(15*k)}"/></g>
      <text class="t sm mut" x="${x.c0+6}" y="${Y(gh.cabTop)+15}">car at full over-travel</text>`;
  }
  // jack
  s += `<g class="part">${tip("pillar")}<rect class="pillar" x="${x.jx-9}" y="${Y(g.M)}" width="18" height="${sq(Y(0)-Y(g.M))}"/></g>`;
  s += `<g class="part">${tip("cyl")}<rect class="cyl" x="${x.jx-15}" y="${Y(g.cyl)}" width="30" height="${sq(Y(g.M)-Y(g.cyl))}" rx="3"/></g>`;
  s += `<g class="part">${tip("plunger")}<rect class="plunger" x="${x.jx-7}" y="${Y(cur.plunger)}" width="14" height="${sq(Y(g.cyl)-Y(cur.plunger))}"/></g>`;
  for (const [h,id] of [[g.O,"O"],[g.P,"P"]]) if (h>0) s += `<g class="part" data-cell="${id==="O"?"E45":"E47"}">${tip(id)}<rect class="bkt" x="${x.jx-17}" y="${Y(h)-3}" width="${x.rail-x.jx+17}" height="6"/></g>`;
  // car
  const cy = Y(cur.cabTop), cb = Y(cur.f);
  s += `<g class="part" data-cell="E22">${tip("cab")}<rect class="cab" x="${x.c0}" y="${cy}" width="${x.c1-x.c0}" height="${sq(cb-cy)}"/><text class="t sm cabt" x="${x.c0+10}" y="${cy+18*FS}">CAB</text></g>`;
  s += `<g class="part" data-cell="E19">${tip("plat")}<rect class="plat" x="${x.c0}" y="${cb}" width="${x.c1-x.c0}" height="${sq(Y(cur.plank)-cb)}"/></g>`;
  s += `<g class="part">${tip("frame")}<path class="frame" d="M${x.c0-4} ${Y(cur.plank)}H${x.u1}V${Y(cur.frameTop)}H${x.u0}V${Y(cur.plank)+Math.max(6,6*k)}H${x.c0-4}Z"/><text class="t xs frt" x="${x.c0+40}" y="${Y(cur.plank)+Math.max(6,6*k)/2+3.5}" text-anchor="middle">PLANK</text></g>`;
  if (g.X>0) s += `<g class="part" data-cell="E23">${tip("uni")}<rect class="uni" x="${x.c1}" y="${Y(cur.uni)-2.5}" width="${x.u0-x.c1}" height="5"/></g>`;
  // sheave + ropes
  const sc = Y(cur.plunger+7.5), sl=x.jx-r, sr=x.jx+r;
  const hitch = Y(Math.min(cur.plank+6, cur.frameTop));
  s += `<g class="part">${tip("deh")}<rect class="deh" x="${sr-5}" y="${Y(8)}" width="12" height="${Y(0)-Y(8)}"/></g>`;
  s += `<g class="part">${tip("rope")}<path class="rope" d="M${sr} ${Y(8)}V${sc}A${r} ${r} 0 0 0 ${sl} ${sc}V${hitch}H${x.u1}"/><path class="rope r2" d="M${sr-3} ${Y(8)}V${sc}A${r-3} ${r-3} 0 0 0 ${sl+3} ${sc}V${hitch-3}H${x.u1}"/></g>`;
  s += `<g class="part">${tip("sheave")}<rect class="sheave" x="${x.jx-21}" y="${Y(cur.plunger+15)}" width="42" height="${sq(15*k)}" rx="3"/><circle class="wheel" cx="${x.jx}" cy="${sc}" r="${r-1}"/><circle class="hub" cx="${x.jx}" cy="${sc}" r="2.5"/></g>`;
  // top of piston rung out line
  s += `<line class="lvl strong" x1="${x.J-14}" y1="${Y(g.line)}" x2="${x.u0}" y2="${Y(g.line)}"/><text class="t xs mut" x="${x.J-12}" y="${Y(g.line)-5}">TOP OF PISTON RUNG OUT</text>`;
  if (g.full+15 > g.N) s += `<rect class="badfill" x="${x.jx-24}" y="${Y(g.full+15)}" width="48" height="${sq(Y(g.N)-Y(g.full+15))}"/><text class="t sm badt" x="${x.jx}" y="${Y(g.full+15)-8}" text-anchor="middle">sheave hits ceiling</text>`;
  // dimensions
  s += `<g class="dim" data-cell="E43"><title>${esc(DIMTIP.E43)}</title><line x1="${x.N}" y1="${Y(0)}" x2="${x.N}" y2="${Y(g.N)}"/><path class="tick" d="M${x.N-5} ${Y(0)+5}L${x.N+5} ${Y(0)-5}M${x.N-5} ${Y(g.N)+5}L${x.N+5} ${Y(g.N)-5}"/><text class="t" transform="translate(${x.N-6} ${(Y(0)+Y(g.N))/2}) rotate(-90)" text-anchor="middle"><tspan class="dl">N</tspan> ${inch(c.E43)} total hoistway</text></g>`;
  s += dimChain(Y, x.DEG, [{a:0,b:g.D,l:"D",v:inch(c.E20),cell:"E20"},{a:g.D,b:g.fTop,l:"E",v:inch(c.E21),cell:"E21"},{a:g.fTop,b:g.N,l:"G",v:inch(c.E24),cell:"E24"}], "l");
  s += dimChain(Y, x.AB, [{a:g.fMin,b:g.D,l:"A",v:inch(c.E17),cell:"E17"}], "l");

  s += dimChain(Y, x.F, [FS<1.25?{a:cur.plank,b:cur.f,l:"C",v:inch(c.E19),cell:"E19"}:null,{a:cur.plank,b:cur.cabTop,l:"F",v:inch(c.E22),cell:"E22"}], "l");
  { const jk = spread([{x:x.J,a:g.fTop,b:g.line,l:"J",v:inch(c.E35),cell:"E35"},{x:x.K,a:g.fMax,b:g.line,l:"K",v:inch(c.E37),cell:"E37"},{x:x.L,a:g.fMax-g.C,b:g.line,l:"L",v:inch(c.E39),cell:"E39"}].map(d=>({...d,y:(Y(d.a)+Y(d.b))/2})), 18);
    for (const d of jk){ const y1=Y(d.a), y2=Y(d.b);
      s += `<g class="dim" data-cell="${d.cell}"><title>${esc(DIMTIP[d.cell])}</title><line x1="${d.x}" y1="${y1}" x2="${d.x}" y2="${y2}"/><path class="tick" d="M${d.x-5} ${y1+5}L${d.x+5} ${y1-5}M${d.x-5} ${y2+5}L${d.x+5} ${y2-5}"/><text class="t" x="${d.x+7}" y="${d.ly+4.5}"><tspan class="dl">${d.l}</tspan> ${d.v}</text></g>`; } }
  if (FS<1.25) s += dimChain(Y, x.u0-8, [{a:g.line,b:g.full,l:"H",v:inch(c.E25),cell:"E25"}], "l");
  const T=c.E31;
  s += dimChain(Y, x.R, [{a:0,b:g.M,l:"M",v:inch(c.E41),cell:"E41"},{a:g.M,b:g.cyl,l:"R",v:inch(c.E63),cell:"E63"},{a:g.cyl,b:g.full,l:"Q",v:inch(c.E61),cell:"E61"},
    {a:g.full,b:g.full+15,l:"",v:"15″ sheave"}, T>=0?{a:g.full+15,b:g.N,l:"T",v:inch(T),cell:"E31",bad:T<6}:{a:g.N,b:g.full+15,l:"T",v:inch(T),cell:"E31",bad:true}], "r");
  // O / P callouts on the right edge
  const op = spread([{y:Y(g.O),l:"O",v:g.O,cell:"E45"},{y:Y(g.P),l:"P",v:g.P,cell:"E47"}].filter(i=>i.v>0), 17);
  for (const i of op) s += `<g class="dim" data-cell="${i.cell}"><title>${esc(DIMTIP[i.cell])}</title><path class="lead dash" d="M${x.rail+3} ${i.y}H${W-78}L${W-70} ${i.ly}"/><text class="t" x="${W-6}" y="${i.ly+4.5}" text-anchor="end"><tspan class="dl">${i.l}</tspan> ${inch(i.v)}↑</text></g>`;
  s += `<g class="dim${c.E33<6?" bad":""}" data-cell="E33"><title>${esc(DIMTIP.E33)}</title><text class="t" x="${x.c0}" y="${Y(g.N)+22}"><tspan class="dl">T2</tspan> ${inch(c.E33)} cab overhead clearance</text></g>`;
  s += `</g></svg>`;
  return svgOpen(W,H,cls,"Hoistway section drawn to scale") + s;
}

  rooms.forEach(([a,b],i)=>{ if (b>a){ s += `<rect x="0" y="${Y(b)}" width="${x.face}" height="${Y(a)-Y(b)}" fill="url(#il-room)"/><rect x="0" y="${Y(a)-10}" width="${x.face}" height="10" fill="#c9a77c"/>`;
    s += `<text class="t il-room" x="14" y="${Y(a)-18}">${i===0?"Bottom floor":"Top floor"}</text>`;
    const dh=Math.min(84, b-a-4)*k; s += `<rect x="${x.face-12}" y="${Y(a)-dh}" width="12" height="${dh}" fill="#7a8794"/><rect x="${x.face-60}" y="${Y(a)-dh-8}" width="60" height="8" fill="#d8c3a5"/>`; }});
  s += `<rect x="0" y="${Y(g.N)-30}" width="${W}" height="30" fill="#c4ccd6"/><rect x="0" y="${Y(g.N)-30}" width="${W}" height="6" fill="#a9b3bf"/>`;
  s += `<g>${tip("pit")}<rect x="${x.face}" y="${Y(g.D)}" width="0" height="0"/><rect x="0" y="${Y(g.D)}" width="${x.face}" height="${Y(0)-Y(g.D)}" fill="#c3c9d1"/><rect x="${x.face-8}" y="${Y(0)}" width="${x.w1-x.face+8}" height="18" fill="#aeb6c0"/></g>`;
  s += `<g>${tip("wall")}<rect x="${x.face}" y="${Y(g.N)}" width="${x.w0-x.face}" height="${Y(0)-Y(g.N)}" fill="url(#il-shaft)"/><rect x="${x.w0}" y="${Y(g.N)-30}" width="${x.w1-x.w0}" height="${Y(0)-Y(g.N)+48}" fill="#c4ccd6"/></g>`;
  s += `<rect x="0" y="${Y(g.fTop)}" width="${x.face}" height="12" fill="#b9c1cb"/>`;
  // rail & brackets
  s += `<g>${tip("rail")}<rect x="${x.rail-3}" y="${Y(g.rail)}" width="6" height="${sq(Y(0)-Y(g.rail))}" fill="#7c8a99"/></g>`;
  const n=Math.max(0,Math.round(g.nb)); for (let i=0;i<n;i++){ const h=n>1?6+(g.rail-12)*i/(n-1):g.rail/2; s+=`<g>${tip("brk")}<rect x="${x.rail+3}" y="${Y(h)-2.5}" width="${x.w0-x.rail-3}" height="5" rx="1" fill="#93a0ad"/></g>`; }
  // jack
  s += `<g filter="url(#il-sh)">${tip("pillar")}<rect x="${x.jx-10}" y="${Y(g.M)}" width="20" height="${sq(Y(0)-Y(g.M))}" fill="#5b6774" rx="2"/></g>`;
  s += `<g filter="url(#il-sh)">${tip("cyl")}<rect x="${x.jx-16}" y="${Y(g.cyl)}" width="32" height="${sq(Y(g.M)-Y(g.cyl))}" rx="6" fill="url(#il-cyl)"/></g>`;
  s += `<g>${tip("plunger")}<rect x="${x.jx-8}" y="${Y(cur.plunger)}" width="16" height="${sq(Y(g.cyl)-Y(cur.plunger))}" fill="url(#il-chrome)"/></g>`;
  for (const [h,id] of [[g.O,"O"],[g.P,"P"]]) if (h>0) s += `<g data-cell="${id==="O"?"E45":"E47"}" class="part">${tip(id)}<rect x="${x.jx-18}" y="${Y(h)-3.5}" width="${x.rail-x.jx+18}" height="7" rx="2" fill="#f08a24"/></g>`;
  // car
  const cy=Y(cur.cabTop), cb=Y(cur.f), pl=Y(cur.plank);
  s += `<g class="part" data-cell="E22" filter="url(#il-sh)">${tip("cab")}<rect x="${x.c0}" y="${cy}" width="${x.c1-x.c0}" height="${sq(cb-cy)}" rx="6" fill="url(#il-cab)" stroke="#b79b72" stroke-width="2"/>
    <rect x="${x.c0+6}" y="${cy+4}" width="${x.c1-x.c0-12}" height="${Math.max(0,Math.min(40,(cb-cy)*.35))}" fill="url(#il-light)"/>
    <line x1="${x.c0+12}" y1="${Y(cur.f+36)}" x2="${x.c1-12}" y2="${Y(cur.f+36)}" stroke="#b79b72" stroke-width="3" stroke-linecap="round"/></g>`;
  // person for scale (69″)
  const ph=69*k, px=x.c0+58, pb=cb; if (cb-cy>ph*0.8){ const hr=ph*0.075;
    s += `<g opacity=".8">${tip("person")}<circle cx="${px}" cy="${pb-ph+hr}" r="${hr}" fill="#5d7ea6"/><path d="M${px-ph*.11} ${pb-ph*.82}Q${px} ${pb-ph*.88} ${px+ph*.11} ${pb-ph*.82}L${px+ph*.09} ${pb-ph*.45}L${px+ph*.06} ${pb}H${px+ph*.01}L${px} ${pb-ph*.42}L${px-ph*.01} ${pb}H${px-ph*.06}L${px-ph*.09} ${pb-ph*.45}Z" fill="#5d7ea6"/></g>`; }
  s += `<g>${tip("plat")}<rect x="${x.c0}" y="${cb}" width="${x.c1-x.c0}" height="${sq(pl-cb)}" fill="#8a6a45"/></g>`;
  s += `<g filter="url(#il-sh)">${tip("frame")}<path d="M${x.c0-4} ${pl}H${x.u1}V${Y(cur.frameTop)}H${x.u0}V${pl+Math.max(7,6*k)}H${x.c0-4}Z" fill="#4f5b68" rx="2"/></g>`;
  if (g.X>0) s += `<g>${tip("uni")}<rect x="${x.c1}" y="${Y(cur.uni)-3}" width="${x.u0-x.c1}" height="6" fill="#4f5b68"/></g>`;
  // ropes & sheave (wheel turns as the piston moves)
  const sc=Y(cur.plunger+7.5), sl=x.jx-r, sr=x.jx+r, ang = ((cur.plunger-g.cyl)/ (Math.PI*2*7.5))*360;
  const hitch=Y(Math.min(cur.plank+6, cur.frameTop));
  s += `<g>${tip("deh")}<rect x="${sr-6}" y="${Y(8)}" width="12" height="${Y(0)-Y(8)}" rx="2" fill="#4f5b68"/></g>`;
  s += `<g>${tip("rope")}<path d="M${sr} ${Y(8)}V${sc}A${r} ${r} 0 0 0 ${sl} ${sc}V${hitch}H${x.u1}" fill="none" stroke="#2b2f36" stroke-width="2.6"/></g>`;
  s += `<g filter="url(#il-sh)">${tip("sheave")}<rect x="${x.jx-22}" y="${Y(cur.plunger+15)}" width="44" height="${sq(15*k)}" rx="5" fill="#c58b3c"/><g transform="rotate(${-ang.toFixed(1)} ${x.jx} ${sc})"><circle cx="${x.jx}" cy="${sc}" r="${r-1}" fill="#e7edf3" stroke="#3b4652" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<line x1="${x.jx}" y1="${sc}" x2="${x.jx+(r-2)*Math.cos(a*Math.PI/180)}" y2="${sc+(r-2)*Math.sin(a*Math.PI/180)}" stroke="#3b4652" stroke-width="1.6"/>`).join("")}</g><circle cx="${x.jx}" cy="${sc}" r="3" fill="#3b4652"/></g>`;
  if (g.full+15>g.N) s += `<rect x="${x.jx-26}" y="${Y(g.full+15)}" width="52" height="${sq(Y(g.N)-Y(g.full+15))}" fill="#e5484d" opacity=".35"/>`;
  // friendly callouts
  const pill = (px,py,txt,cell,tone="",anchor="start", tx=px, ty=py) => {
    const w = (txt.length*7.3+20)*FS, x0 = anchor==="end" ? px-w : px;
    return `<g class="callout ${tone}" data-cell="${cell}"><title>${esc(DIMTIP[cell]||txt)}</title>${tx!==px||ty!==py?`<path d="M${anchor==="end"?px:px} ${py}L${tx} ${ty}" class="cl-lead"/><circle cx="${tx}" cy="${ty}" r="3" class="cl-dot"/>`:""}<rect x="${x0}" y="${py-13*FS}" width="${w}" height="${26*FS}" rx="${13*FS}"/><text x="${x0+w/2}" y="${py+5*FS}" text-anchor="middle">${esc(txt)}</text></g>`; };
  const left = spread([
    {y:(Y(0)+Y(g.D))/2, t:`Pit ${inch(c.E20)}`, cell:"E20"},
    {y:(Y(g.D)+Y(g.fTop))/2, t:`Travel ${inch(c.E21)}`, cell:"E21"},
    {y:(Y(g.fTop)+Y(g.N))/2, t:`Overhead ${inch(c.E24)}`, cell:"E24"},
    {y:Y(g.N)-48, t:`Total height ${inch(c.E43)}`, cell:"E43"},
  ], 34);
  spread(left, 34, 30, H-30); for (const p of left) s += pill(160, p.ly, p.t, p.cell, "", "end");
  const okT=c.E31>=6, okT2=c.E33>=6;
  const right = spread([
    {y:(Y(g.full+15)+Y(g.N))/2, t:`${okT?"✓":"✕"} Sheave clearance ${inch(c.E31)}`, cell:"E31", tone:okT?"ok":"bad", ty:(Y(g.full+15)+Y(g.N))/2, tx:x.jx+22},
    {y:Y(cur.cabTop)-24, t:`${okT2?"✓":"✕"} Cab clearance ${inch(c.E33)}`, cell:"E33", tone:okT2?"ok":"bad", tx:x.c1-10, ty:Y(cur.cabTop)},
    {y:(Y(g.cyl)+Y(g.full))/2, t:`Stroke ${inch(c.E61)}`, cell:"E61", tx:x.jx+8, ty:(Y(g.cyl)+Y(cur.plunger))/2},
    {y:(Y(g.M)+Y(g.cyl))/2, t:`Jack ${inch(c.E63)}`, cell:"E63", tx:x.jx+16, ty:(Y(g.M)+Y(g.cyl))/2},
    {y:(Y(0)+Y(g.M))/2, t:`Pillar ${inch(c.E41)}`, cell:"E41", tx:x.jx+10, ty:(Y(0)+Y(g.M))/2},
  ], 34, 30, H-30);
  for (const p of right) s += pill(612, p.ly, p.t, p.cell, p.tone||"", "start", p.tx, p.ty);
  s += `<text class="t il-cab" x="${(x.c0+x.c1)/2}" y="${Math.min(cb-10, cy+22)}" text-anchor="middle">Cab ${inch(c.E22)}</text>`;
  return svgOpen(W,H,cls,"Illustrated hoistway, drawn to scale") + s + `</svg>`;
}

/* ---------------- 3 · simple blocks ---------------- */
function paintBlocks(c, o){
  const W=760, H=980, g=hoistGeo(c), cls="hw-blocks";
  if (!g.ok) return emptySVG(W,H,cls,"Enter the travel (E) to draw the hoistway");
  const {Y} = scaleFor(g,H,70,40);
  const f=carF(g,o), cur=g.at(f);
  const cols = [{x:24,w:178,t:"Building"},{x:262,w:178,t:"Jack side"},{x:500,w:178,t:"Car"}];
  let s = `<rect class="bg" width="${W}" height="${H}"/>`;
  cols.forEach(cl => s += `<text class="t hd" x="${cl.x+cl.w/2}" y="34" text-anchor="middle">${cl.t}</text>`);
  s += `<line class="lvl" x1="20" x2="${W-20}" y1="${Y(0)}" y2="${Y(0)}"/><text class="t xs mut" x="22" y="${Y(0)+14}">PIT FLOOR</text>`;
  for (const [v,l] of [[g.D,"BOTTOM FLOOR"],[g.fTop,"TOP FLOOR"],[g.N,"CEILING"]]) s += `<line class="lvl dash" x1="20" x2="${W-20}" y1="${Y(v)}" y2="${Y(v)}"/><text class="t xs mut" x="${cols[2].x+4}" y="${Y(v)+(l==="CEILING"?-5:13)}">${l}</text>`;
  const block = (cl, a, b, name, val, cell, tone, plain) => {
    const y1=Y(b), y2=Y(a), h=Math.max(0,y2-y1); if (h<=0 && !val) return "";
    const big = h>=40, mid = h>=22;
    return `<g class="blk ${tone||""}" data-cell="${cell||""}"><title>${esc(DIMTIP[cell]||name)}</title><rect x="${cl.x}" y="${y1}" width="${cl.w}" height="${Math.max(1.5,h)}" rx="${Math.min(8,h/2)}"/>
      ${big?`<text class="t bn" x="${cl.x+cl.w/2}" y="${(y1+y2)/2-3}" text-anchor="middle">${name}</text><text class="t bv" x="${cl.x+cl.w/2}" y="${(y1+y2)/2+15}" text-anchor="middle">${val}</text>`
        : mid?`<text class="t bn" x="${cl.x+cl.w/2}" y="${(y1+y2)/2+5}" text-anchor="middle">${name} · ${val}</text>`:""}
      ${!mid?`<text class="t sm side" x="${cl.x+cl.w+6}" y="${(y1+y2)/2+4}">${plain||name} ${val}</text>`:""}</g>`;
  };
  const [b0,b1,b2]=cols;
  s += block(b0,0,g.D,"Pit (D)",inch(c.E20),"E20","k1");
  s += block(b0,g.D,g.fTop,"Travel (E)",inch(c.E21),"E21","k2");
  s += block(b0,g.fTop,g.N,"Overhead (G)",inch(c.E24),"E24","k3");
  const T=c.E31;
  s += block(b1,0,g.M,"Pillar (M)",inch(c.E41),"E41","k4");
  s += block(b1,g.M,g.cyl,"Jack body (R)",inch(c.E63),"E63","k5");
  s += block(b1,g.cyl,g.full,"Stroke (Q)",inch(c.E61),"E61","k6");
  s += block(b1,g.full,g.full+15,"Sheave","15″","","k7","Sheave");
  s += T>=0 ? block(b1,g.full+15,g.N,"Clearance (T)",inch(T),"E31",T<6?"bad":"ok","T") : block(b1,g.N,g.full+15,"Too tall by",inch(-T),"E31","bad","Too tall by");
  // car column: travel zone + car
  s += `<g class="blk zone" data-cell="E17"><title>${esc(DIMTIP.E17)}</title><rect x="${b2.x}" y="${Y(g.D)}" width="${b2.w}" height="${Math.max(1,Y(g.fMin)-Y(g.D))}"/></g>`;
  s += `<g class="blk zone" data-cell="E18"><title>${esc(DIMTIP.E18)}</title><rect x="${b2.x}" y="${Y(g.fMax)}" width="${b2.w}" height="${Math.max(1,Y(g.fTop)-Y(g.fMax))}"/></g>`;
  s += `<text class="t sm side" x="${b2.x+b2.w+6}" y="${(Y(g.fMax)+Y(g.fTop))/2+4}">B ${inch(c.E18)}</text><text class="t sm side" x="${b2.x+b2.w+6}" y="${(Y(g.fMin)+Y(g.D))/2+8}">A ${inch(c.E17)}</text>`;
  s += block(b2,cur.plank,cur.cabTop,"Cab (F)",inch(c.E22),"E22","k8");
  s += `<g class="blk k9" data-cell="E33"><title>${esc(DIMTIP.E33)}</title><text class="t sm ${c.E33<6?"badt":"mut"}" x="${b2.x+b2.w/2}" y="${Y(g.N)+18}" text-anchor="middle">Cab clearance T2 ${inch(c.E33)}</text></g>`;
  s += `<text class="t hd2" x="${b0.x+b0.w/2}" y="54" text-anchor="middle">= ${inch(c.E43)}</text><text class="t hd2" x="${b1.x+b1.w/2}" y="54" text-anchor="middle">= ${inch(g.M+g.R+g.Q+15+Math.max(0,T))}</text><text class="t hd2" x="${b2.x+b2.w/2}" y="54" text-anchor="middle">at ${(POS.find(p=>p.id===o.pos)||{name:"moving"}).name.toLowerCase()}</text>`;
  return svgOpen(W,H,cls,"Simple block diagram of the hoistway heights") + s + `</svg>`;
}

/* ---------------- 4 · isometric 3D ---------------- */
function paintIso(c, o){
  const W=760, H=980, g=hoistGeo(c), cls="hw-iso";
  if (!g.ok) return emptySVG(W,H,cls,"Enter the travel (E) to draw the hoistway");
  const f=carF(g,o), cur=g.at(f);
  const SW=60, SD=66; // nominal plan size of the hoistway (illustrative, not an input)
  const lo=Math.min(0,g.fMin-g.C-8), hi=Math.max(g.N, g.full+15, g.rail)+6;
  const cos=Math.cos(Math.PI/6), sin=.5, k=Math.min((H-80)/((hi-lo)+(SW+SD)*sin), (W-400)/((SW+SD)*cos));
  const ox = 205 + SD*cos*k, oy = H-40-(SW+SD)*sin*k + lo*k;
  const P=(x,y,z)=>[ox+(x-y)*cos*k, oy+(x+y)*sin*k-z*k], pt=p=>p.map(v=>v.toFixed(1)).join(",");
  const poly=(pts,cl,extra="")=>`<polygon class="${cl}" points="${pts.map(pt).join(" ")}" ${extra}/>`;
  const box=(x,y,z,w,d,h,cl,id)=>{ if (h<=0) return ""; const t=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
    return `<g class="part ${cl}">${tip(id)}${poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],"fl")}${poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],"fr")}${poly(t,"ft")}</g>`; };
  const cyl=(cx,cy,z,rad,h,cl,id)=>{ if (h<=0) return ""; const [ax,ay]=P(cx,cy,z), [bx,by]=P(cx,cy,z+h), rx=rad*k*1.22, ry=rad*k*.7;
    return `<g class="part ${cl}">${tip(id)}<path class="cb" d="M${ax-rx} ${ay}A${rx} ${ry} 0 0 0 ${ax+rx} ${ay}L${bx+rx} ${by}A${rx} ${ry} 0 0 0 ${bx-rx} ${by}Z"/><ellipse class="ct" cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}"/></g>`; };
  let s = `<defs><linearGradient id="iso-bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3f6fb"/><stop offset="1" stop-color="#dfe6ef"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#iso-bg)"/>`;
  // back walls (x=0 plane and y=0 plane), floor, ceiling outline
  s += `<g>${tip("wall")}${poly([P(0,0,0),P(0,SD,0),P(0,SD,g.N),P(0,0,g.N)],"wallL")}${poly([P(0,0,0),P(SW,0,0),P(SW,0,g.N),P(0,0,g.N)],"wallR")}</g>`;
  s += `<g>${tip("pit")}${poly([P(0,0,0),P(SW,0,0),P(SW,SD,0),P(0,SD,0)],"pitf")}</g>`;
  // landings: slabs in front (y beyond SD) at D and top floor
  for (const [z,lab] of [[g.D,"Bottom floor"],[g.fTop,"Top floor"]]){
    s += `<g>${tip("floor")}${box(-4, SD, z-8, SW+8, 34, 8, "slab")}</g>`;
    const [lx,ly]=P(-4,SD+34,z); s += `<text class="t sm mut" x="${lx-6}" y="${ly+4}" text-anchor="end">${lab}</text>`;
  }
  // rail + jack at the back right
  const jx=SW-14, jy=10;
  s += box(SW-6, 2, 0, 3, 3, g.rail, "rail", "rail");
  s += cyl(jx,jy,0,4,g.M,"pillar","pillar");
  s += cyl(jx,jy,g.M,7,g.R,"cyl","cyl");
  s += cyl(jx,jy,g.cyl,3.2,cur.plunger-g.cyl,"plunger","plunger");
  s += box(jx-8,jy-6,cur.plunger,16,12,15,"sheave","sheave");
  // ropes
  const [r1x,r1y]=P(jx+9,jy,0), [r2x,r2y]=P(jx+6,jy,cur.plunger+12), [r3x,r3y]=P(jx-6,jy+6,cur.plunger+12), [r4x,r4y]=P(SW-24,jy+12,cur.plank+6);
  s += `<g class="part">${tip("rope")}<path class="rope" d="M${r1x} ${r1y}L${r2x} ${r2y}L${r3x} ${r3y}L${r4x} ${r4y}"/></g>`;
  // car frame upright + plank + cab
  s += box(SW-27, 12, cur.plank, 4, 34, cur.frameTop-cur.plank, "frame", "frame");
  s += box(6, 12, cur.plank-6, SW-29, 46, 6, "frame", "frame");
  s += box(6, 12, cur.plank, SW-33, 46, cur.cabTop-cur.plank, "cab", "cab");
  // ceiling outline
  s += `<g>${tip("ceil")}${poly([P(0,0,g.N),P(SW,0,g.N),P(SW,SD,g.N),P(0,SD,g.N)],"ceil")}</g>`;
  s += `<path class="edge" d="M${pt(P(SW,0,0))}L${pt(P(SW,SD,0))}L${pt(P(0,SD,0))}M${pt(P(SW,SD,0))}L${pt(P(SW,SD,g.N))}"/>`;
  if (g.full+15>g.N) { const [ax,ay]=P(jx,jy,g.N); s += `<text class="t sm badt" x="${ax}" y="${ay-30}" text-anchor="middle">sheave hits ceiling</text>`; }
  // callouts
  const T=c.E31, items = spread([
    {p:P(jx,jy,(g.full+15+g.N)/2), t:`T sheave clearance ${inch(T)}`, cell:"E31", bad:T<6},
    {p:P(jx,jy,(g.cyl+cur.plunger)/2), t:`Q stroke ${inch(c.E61)}`, cell:"E61"},
    {p:P(jx,jy,(g.M+g.cyl)/2), t:`R jack ${inch(c.E63)}`, cell:"E63"},
    {p:P(jx,jy,g.M/2), t:`M pillar ${inch(c.E41)}`, cell:"E41"},
    {p:P(SW-6,2,g.rail), t:`Rail ${inch(c.E49)} · ${num(c.E51,0)} brackets`, cell:"E49"},
  ].map(i=>({...i,y:i.p[1]})), 22);
  for (const i of items) s += `<g class="dim${i.bad?" bad":""}" data-cell="${i.cell}"><title>${esc(DIMTIP[i.cell]||i.t)}</title><path class="lead" d="M${i.p[0]} ${i.p[1]}L${W-250} ${i.ly}H${W-238}"/><circle cx="${i.p[0]}" cy="${i.p[1]}" r="2.6" class="dot"/><text class="t" x="${W-234}" y="${i.ly+4.5}">${i.t}</text></g>`;
  const left = spread([
    {z:g.D/2, t:`D pit ${inch(c.E20)}`, cell:"E20"},{z:(g.D+g.fTop)/2, t:`E travel ${inch(c.E21)}`, cell:"E21"},{z:(g.fTop+g.N)/2, t:`G overhead ${inch(c.E24)}`, cell:"E24"},
    {z:(cur.plank+cur.cabTop)/2, t:`F cab ${inch(c.E22)}`, cell:"E22"},{z:g.N, t:`N total ${inch(c.E43)}`, cell:"E43"},
    {z:g.N-2, t:`T2 cab clearance ${inch(c.E33)}`, cell:"E33", bad:c.E33<6, at:P(6,30,cur.cabTop)},
  ].map(i=>{ const p=i.at||P(0,SD,i.z); return {...i,p,y:p[1]}; }), 22);
  for (const i of left) s += `<g class="dim${i.bad?" bad":""}" data-cell="${i.cell}"><title>${esc(DIMTIP[i.cell]||i.t)}</title><path class="lead" d="M${i.p[0]} ${i.p[1]}L${192} ${i.ly}H${182}"/><circle cx="${i.p[0]}" cy="${i.p[1]}" r="2.6" class="dot"/><text class="t" x="178" y="${i.ly+4.5}" text-anchor="end">${i.t}</text></g>`;
  s += `<text class="t xs mut" x="${W-10}" y="${H-12}" text-anchor="end">heights to scale · plan size illustrative</text>`;
  return svgOpen(W,H,cls,"3D view of the hoistway, heights to scale") + s + `</svg>`;
}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const num=(v,dp=2)=>{ if (typeof v!=="number"||!isFinite(v)) return (v===""||v==null)?"—":String(v); if (Math.abs(v)<.5*Math.pow(10,-dp)) v=0; return v.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}); };
const r2=v=>Math.round(v*100)/100;
const meta=cell=>IN[cell]||OUT[cell]||{};
const unitOf=cell=>meta(cell).u||"in";
const dpOf=cell=>meta(cell).dp??2;
const fmt=(cell,v)=>{ const u=unitOf(cell); if (u==="in") return inch(v); return num(v,dpOf(cell)); };
const ftin=v=>{ if (typeof v!=="number"||!isFinite(v)||Math.abs(v)<12) return ""; const s=v<0?"−":""; v=Math.abs(v); let ft=Math.floor(v/12), i=+(v-ft*12).toFixed(2); if (i>=12){ft++;i=0;} return `${s}${ft}′-${i}″`; };
// Accept 96, 96", 96in, 8', 8'0", 8' 0, 8-0, 8 0, 8ft 0in, 7.5ft
function parseLen(raw){
  const s=String(raw).trim().toLowerCase().replace(/[’′]/g,"'").replace(/[”″]/g,'"').replace(/''/g,'"');
  if (!s) return "";
  let m=s.match(/^(-?\d+(?:\.\d+)?)\s*(?:'|ft|feet|foot)\s*-?\s*(?:(\d+(?:\.\d+)?)\s*(?:"|in|inch|inches)?)?$/); if (m) return +m[1]*12+(m[2]?+m[2]:0);
  m=s.match(/^(\d+)\s*[- ]\s*(\d+(?:\.\d+)?)\s*(?:"|in)?$/); if (m) return +m[1]*12+ +m[2];
  m=s.match(/^(-?\d*\.?\d+)\s*(?:"|in|inch|inches|lb|lbs)?$/); if (m) return parseFloat(m[1]);
  return NaN;
}

function invalids(over){
  const out=[];

  return out;
}
function problems(c){
  const P=[], set=(cell,val,label)=>({cell,val:r2(val),label:label||`Set ${IN[cell].tag} to ${fmt(cell,r2(val))}`});
  if (c.A9){ const miss=["E17","E18","E19","E20","E21","E22","E24","E27"].filter(k=>!(parseFloat(state[k])>0));
    P.push({t:`Some inputs are missing or zero: ${miss.map(k=>IN[k].tag+" ("+IN[k].t.toLowerCase()+")").join(", ")}.`, sheet:c.A9, src:"A9", go:miss}); }
  if (c.K78>0){
    const parts=[]; if (c.K76>0) parts.push(`sheave clearance T is ${inch(c.E31)}`); if (c.K77>0) parts.push(`cab clearance T2 is ${inch(c.E33)}`);
    const fx=[set("E24", c.E24+c.K78, `Raise overhead G to ${inch(r2(c.E24+c.K78))}`)];
    if (c.K76<=0 && c.K77>0 && c.E22-c.K77>0) fx.push(set("E22", c.E22-c.K77, `Lower cab height F to ${inch(r2(c.E22-c.K77))}`));
    P.push({t:`Not enough overhead: ${parts.join(" and ")}; code needs at least 6″. Add ${inch(r2(c.L13))} of overhead.`, sheet:`${c.A13} ${num(c.L13)} ${c.M13} · ${c.A14}`, src:"A13 · A14", fix:fx, cells:["E24","E31","E33"]});
  }
  if (c.J20!=="") P.push({t:`The pit is too shallow for A and C: it needs at least ${inch(c.J20)}.`, sheet:`${c.L20}: ${num(c.J20)} ${c.K20}`, src:"J20", fix:[set("E20", Math.max(8,c.J20), `Deepen pit D to ${inch(Math.max(8,c.J20))}`)], cells:["E20"]});
  if (c.J27){ const s=c.E26+c.E27, fx=[]; if (1679-c.E27>=0) fx.push(set("E26",1679-c.E27,`Set capacity W1 to ${num(1679-c.E27,0)} lb`)); if (1679-c.E26>=0) fx.push(set("E27",1679-c.E26,`Set cab weight W2 to ${num(1679-c.E26,0)} lb`));
    P.push({t:`Capacity plus cab weight is ${num(s,0)} lb; the limit is 1679 lb.`, sheet:c.J27, src:"J27", fix:fx, cells:["E26","E27"]}); }
  for (const v of invalids()) P.push({t:v.msg, sheet:v.sheet, src:`${v.cell} · ${v.hard?"Excel rejects this value":"note in the sheet, not enforced"}`, warn:!v.hard, fix:[set(v.cell, v.fix(v.v))], cells:[v.cell]});
  if (c.E21>0 && c.E61===0){
    if (c.B71>252) P.push({t:`Required stroke ${inch(c.B71)} is longer than the biggest standard jack (252″), so no jack is selected.`, sheet:"(the sheet shows no warning)", src:"calculator note", warn:1, cells:["E21"]});
    else P.push({t:`Required stroke is exactly 67″. The sheet's 67″ test uses “<”, so no jack is selected. Change A, B or E slightly.`, sheet:"(the sheet shows no warning)", src:"calculator note", warn:1, fix:[set("E18", (parseFloat(state.E18)||0)+1, `Raise top over-travel B to ${inch((parseFloat(state.E18)||0)+1)}`)], cells:["E18"]});
  }
  for (const k of Object.keys(bad)) P.unshift({t:`${IN[k].tag} (${IN[k].t.toLowerCase()}): couldn't read “${bad[k]}”. Enter inches like 96, or feet and inches like 8'0".`, src:"entry", go:[k]});
  return P;
}
function probsHTML(c, withFix=true){

  return `<div class="probs">${P.map(p=>`<div class="prob${p.warn?" warn":""}"><div class="pt">${esc(p.t)}</div>
    ${withFix&&(p.fix||p.go)?`<div class="fx">${(p.fix||[]).map(f=>`<button class="apply" data-apply="${f.cell}" data-val="${f.val}">${esc(f.label)}</button>`).join("")}${(p.go||[]).map(k=>`<button data-go="${k}">Go to ${IN[k].tag}</button>`).join("")}</div>`:""}
    <div class="ps xl">Sheet: ${esc(p.sheet||"")} · ${esc(p.src)}</div></div>`).join("")}</div>`;
}
function chips(c){
  const st=[], T=c.E31, T2=c.E33, ld=c.E26+c.E27;
  st.push({k:T>=6?"ok":"bad", l:"Sheave clearance T", v:inch(T), cell:"E31"});
  st.push({k:T2>=6?"ok":"bad", l:"Cab clearance T2", v:inch(T2), cell:"E33"});
  st.push({k:c.J20===""?"ok":"bad", l:"Pit", v:c.J20===""?inch(c.E20):`needs ${inch(c.J20)}`, cell:"E20"});
  st.push({k:c.J27?"bad":"ok", l:"Load", v:`${num(ld,0)} / 1,679 lb`, cell:"E26"});
  st.push({k:c.E61>0?"info":"bad", l:"Jack", v:c.E61>0?`${c.E61}″ · ${c.E61>174?"80":"70"}mm`:"none", cell:"E61"});
  st.push({k:c.J6?"info":"warn", l:"Frame", v:c.J6?(c.E23>=90.5?"8 ft":"7 ft")+` · ${c.M4}`:"—", cell:"E23"});
  const n=problems(c).length;
  if (!n) st.push({k:"ok all", l:"All checks pass", v:"", cell:""}); else st.push({k:"bad", l:`${n} problem${n>1?"s":""} to fix`, v:"↓", cell:""});
  return `<div class="chips">${st.map(s=>`<button class="chip ${s.k}" data-focus="${s.cell}" title="Show ${esc(s.l)}"><span class="ic">${s.k.startsWith("ok")?"✓":s.k==="bad"?"✕":s.k==="warn"?"!":"i"}</span>${esc(s.l)} <b>${esc(s.v)}</b></button>`).join("")}</div>`;
}

function paintViewers(){
  for (const v of $$("[data-viewer]")){
    const style = v.dataset.force || DV.style;
    const cv=v.querySelector("[data-vcanvas]"), w=cv.clientWidth||760, fs=Math.min(1.7, Math.max(1, 10.5*(style==="illustrated"?820:760)/(w*14)));
    cv.innerHTML = drawHoistway(C, {style, pos:v.dataset.force?"bottom":DV.pos, f:v.dataset.force?null:DV.f, fs});
    const nm=v.querySelector("[data-vname]"); if (nm) nm.textContent = DSTYLES.find(d=>d.id===style).name;
    const dots=v.querySelector("[data-vdots]"); if (dots) dots.innerHTML = DSTYLES.map(d=>`<i class="${d.id===style?"on":""}" data-vset="${d.id}" title="${d.name}"></i>`).join("");
    const df=v.querySelector("[data-vdef]"); if (df){ const is = store.get(K_STYLE)===style || (!store.get(K_STYLE) && style==="technical"); df.textContent = is ? "★ default" : "☆ Make default"; df.className = "vdef"+(is?" is":""); }
    for (const b of v.querySelectorAll("[data-vpos]")) b.setAttribute("aria-pressed", DV.f==null && DV.pos===b.dataset.vpos);
    const pl=v.querySelector("[data-vplay]"); if (pl) pl.textContent = DV.raf ? "■ Stop" : "▶ Ride";
  }
  applyHL();
}
function ride(){
  if (DV.raf){ cancelAnimationFrame(DV.raf); DV.raf=0; DV.f=null; paintViewers(); return; }
  const t0=performance.now(), period=8000;
  const step=t=>{ const g=hoistGeo(C), p=((t-t0)%period)/period; DV.f = g.fMin + (g.fMax-g.fMin)*(0.5-0.5*Math.cos(p*2*Math.PI)); DV.raf=requestAnimationFrame(step); paintViewers(); };
  DV.raf=requestAnimationFrame(step);
}

let HL=null;

/* ============================ update ============================ */
let CUR=null;
function update(){
  C = compute();
  const c=C;
  for (const el of $$("[data-k]")){
    if (el===document.activeElement && el.type!=="range") continue;
    const k=el.dataset.k, v=state[k]??"";
    if (el.type==="range") el.value = v===""?el.min:v;
    else if (bad[k]==null && el.value!==String(v)) el.value=v;
  }
  for (const el of $$("[data-out]")){ const cell=el.dataset.out, v=c[cell]; el.textContent = unitOf(cell)==="in" ? inch(v) : num(v, el.dataset.dp!=null?+el.dataset.dp:dpOf(cell)); }
  for (const el of $$("[data-ft]")) el.textContent = unitOf(el.dataset.ft)==="in" ? ftin(c[el.dataset.ft]) : "";
  for (const el of $$("[data-text]")){ const v=c[el.dataset.text]; el.textContent = (v===""||v==null) ? (el.dataset.empty??"—") : String(v).replace(/^Capacity \(|^Cab weight \(/,"").replace(/\)$/,"").replace(/Lbs$/," lb"); }
  const inv=Object.fromEntries(invalids().map(v=>[v.cell,v]));
  for (const el of $$("[data-msg]")){ const k=el.dataset.msg, v=inv[k];
    el.textContent = bad[k]!=null ? "Enter inches (96) or feet-inches (8'0\")" : v ? v.msg : "";
    el.className = "msg"+(v&&!v.hard&&bad[k]==null?" soft":"");
    el.closest("[data-fld]")?.classList.toggle("err", bad[k]!=null || !!(v&&v.hard)); }
  for (const el of $$("[data-ftin]")){ const k=el.dataset.ftin; el.textContent = unitOf(k)==="in" ? (ftin(parseFloat(state[k]))? "= "+ftin(parseFloat(state[k])) : "") : ""; }
  for (const el of $$("[data-recfor]")){ const k=el.dataset.recfor; el.hidden = !((parseFloat(state[k])||0) < IN[k].rec); }
  for (const el of $$("[data-res]")){ const cell=el.dataset.res; if (OUT[cell].code){ el.classList.toggle("bad", c[cell]<6); el.classList.toggle("okc", c[cell]>=6); } }
  for (const el of $$("[data-kr]")){ const cell=el.dataset.kr; if (OUT[cell].code){ el.classList.toggle("bad", c[cell]<6); el.classList.toggle("ok", c[cell]>=6); } }
  for (const el of $$("[data-chips]")) el.innerHTML = chips(c);
  for (const el of $$("[data-probs]")) el.innerHTML = probsHTML(c, "chip");
  for (const el of $$("[data-status]")) el.innerHTML = probsHTML(c, el.dataset.status!=="nofix");
  for (const el of $$("[data-date]")) el.textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  for (const el of $$("[data-strokes]")) el.innerHTML = strokesRows(c);
  for (const el of $$("[data-helpers]")) el.innerHTML = helperRows(c);
  CUR?.update?.(c);
  paintViewers();
}
function setVal(k, v){ state[k] = v===""?"":String(v); delete bad[k]; save(); update(); }

/* what-if */
let SNAP=null;
function trackFor(k){
  const m=IN[k], n=48, stops=[];
  for (let i=0;i<=n;i++){ const v=m.min+(m.max-m.min)*i/n, c=compute({[k]:v});
    const ok = c.E31>=6 && c.E33>=6 && c.J20==="" && !c.J27 && !(c.E21>0&&c.E61===0) && !invalids({[k]:v}).some(x=>x.hard&&x.cell===k);
    stops.push(ok); }
  const okc=getComputedStyle(document.documentElement).getPropertyValue("--ok").trim()||"#18794e", badc="#e5484d";
  return `linear-gradient(90deg,${stops.map((ok,i)=>`${ok?okc:badc} ${(i/n*100).toFixed(1)}% ${((i+1)/n*100).toFixed(1)}%`).join(",")})`;
}
V.whatif = {
  build:()=>{ SNAP={...state}; return `<div class="wi"><section class="card"><h2>Explore</h2><div class="legend"><span><i style="background:var(--ok)"></i>passes every check</span><span><i style="background:#e5484d"></i>would fail a check</span></div>
      ${IN_UI.map(k=>`<div class="sl" data-cell="${k}"><div class="top"><label class="lab" for="w-${k}"><span class="badge">${IN[k].tag}</span>${IN[k].t}</label><span class="delta" data-delta="${k}"></span><input id="w-${k}" type="text" inputmode="decimal" data-k="${k}"></div>
        <input type="range" data-k="${k}" min="${IN[k].min}" max="${IN[k].max}" step="${IN[k].step}" aria-label="${esc(IN[k].t)} slider"><div class="ends"><span>${IN[k].min}</span><span>${unitOf(k)}</span><span>${IN[k].max}</span></div></div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button data-snapreset>↺ Back to where I started</button><button data-snapnew>Compare from here</button></div></section>
    <div class="stick">${viewer()}<div class="keyres">${["E31","E33","E61","E41","E49","E53","L61","E43"].map(k=>`<div class="kr" data-cell="${k}" data-kr="${k}"><small>${OUT[k].t}</small><b data-out="${k}"></b> <span class="dd" data-dd="${k}"></span></div>`).join("")}</div></div></div>`; },
  update(c){
    for (const r of $$('.sl input[type=range]')) r.style.setProperty("--track", trackFor(r.dataset.k));
    const c0 = SNAP ? compute(SNAP) : c;
    for (const el of $$("[data-delta]")){ const k=el.dataset.delta, d=(parseFloat(state[k])||0)-(parseFloat(SNAP?.[k])||0); el.textContent = Math.abs(d)>1e-9 ? (d>0?"+":"")+num(d,unitOf(k)==="in"?1:0) : ""; }
    for (const el of $$("[data-dd]")){ const k=el.dataset.dd, d=c[k]-c0[k]; el.textContent = Math.abs(d)>1e-9 ? (d>0?"▲":"▼")+num(Math.abs(d),dpOf(k)) : ""; el.className="dd "+(d>0?"up":"dn"); }
  }
};

/* report */
V.report = {
  build:()=>`<div class="rpbar noprint"><span>Green values can be edited here. Print or “Save as PDF” gives just the page.</span><button class="primary" data-print>Print / Save PDF</button></div>
  <article class="paper">
    <header class="rp-h"><img src="${LOGO}" alt="OLS logo"><div><h2>T601 Car Frame Calculations</h2><div class="muted" style="font-size:12.5px">OLS Inc. · 2 Cochran Drive · Ayr, On Canada, N0B 1E0 · 601102_REV: 5</div></div>
      <div class="rp-id">OLS PART No.<br><b data-text="M4"></b><br>MODEL<br><b data-text="J6" style="font-size:12px"></b></div></header>
    <div class="rp-job"><div><small>Job name</small><input data-k="job" aria-label="Job name"></div><div><small>Job no</small><input data-k="jobno" placeholder="—" aria-label="Job number"></div><div><small>Printed</small><b data-date></b></div></div>
    <div data-status="nofix"></div>
    <div class="rp-cols">
      <section><h3>Inputs</h3><table>${IN_UI.map(k=>`<tr data-cell="${k}"><td class="r">${IN[k].tag}</td><td>${IN[k].t}</td><td class="v"><input type="text" inputmode="decimal" data-k="${k}" aria-label="${esc(IN[k].t)}"></td><td class="u">${unitOf(k)}</td></tr>`).join("")}</table>
        <h3 style="margin-top:14px">Jack · <span data-text="A57" style="text-transform:none;letter-spacing:0"></span></h3>
        <table>${["E59","E61","E63","E65","E67","L59","L61","L63","L65"].map(k=>`<tr data-cell="${k}"><td class="r">${OUT[k].tag}</td><td>${OUT[k].t}</td><td class="v" data-out="${k}"></td><td class="u">${unitOf(k)==="in"?"in":unitOf(k)}</td></tr>`).join("")}</table></section>
      <section><h3>Results</h3><table>${["E31","E33","E35","E37","E39","E41","E43","E45","E47","E49","E51","E53"].map(k=>`<tr data-cell="${k}"><td class="r">${OUT[k].tag}</td><td>${OUT[k].t}</td><td class="v" data-out="${k}"></td><td class="u">${unitOf(k)==="in"?"in":unitOf(k)}</td></tr>`).join("")}</table>
        <h3 style="margin-top:14px">Hoistway section (to scale)</h3><div class="rp-dwg">${viewer({bare:1, force:"technical"})}</div></section>
    </div>
    <footer class="rp-foot"><span>Calculated with the 601102_R5 formulas. Confirm with the local code / authority having jurisdiction.</span><span data-text="J6"></span></footer>
  </article>`
};

/* ============================ shell & events ============================ */
const getDefault=()=>{ const d=store.get(K_LAY); return LAYOUTS.some(l=>l.id===d)?d:"split"; };
let current=null;
function renderTabs(){
  const def=getDefault(), L=LAYOUTS.find(l=>l.id===current);
  $("#tabs").innerHTML = LAYOUTS.map((l,i)=>`<button role="tab" data-layout="${l.id}" aria-selected="${l.id===current}" title="${esc(l.desc)}">${l.name}${l.id===def?'<span class="star" aria-label="default">★</span>':""}</button>`).join("");
  const b=$("#mkdef"); if (current===def){ b.textContent="★ Opens by default"; b.className="mkdef is"; } else { b.textContent=`☆ Open “${L.name}” by default`; b.className="mkdef"; }
  $("#laydesc").textContent=L.desc;
}
function show(id){
  if (!V[id]) id=getDefault();
  current=id; CUR=V[id]; SEL=null; HL=null;
  document.body.classList.toggle("report", id==="report");
  $("#view").innerHTML = CUR.build();
  renderTabs();
  if (location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
  update();
  CUR.after?.();
}
function focusCell(cell){
  const inp = $$(`#view input[data-k="${cell}"]:not([type=range])`).find(i=>i.offsetParent);
  if (inp){ inp.focus({preventScroll:true}); inp.scrollIntoView({block:"center",behavior:"smooth"}); inp.select?.(); return true; }
  return false;
}
function openPop(cell, x, y){
  const pop=$("#pop");
  if (IN[cell]) pop.innerHTML = `<button class="x" data-popx aria-label="Close">×</button><h4>${IN[cell].tag} · ${IN[cell].t}</h4><p>${esc(DIMTIP[cell]||IN[cell].hint)}</p>${fld(cell,{nohint:1})}`;
  else if (OUT[cell]) pop.innerHTML = `<button class="x" data-popx aria-label="Close">×</button><h4>${OUT[cell].tag?OUT[cell].tag+" · ":""}${OUT[cell].t}</h4><p>${esc(DIMTIP[cell]||"")}</p>${resRow(cell).replace('class="res"','class="res open"')}`;
  else return;
  pop.hidden=false;
  const w=pop.offsetWidth, sx=Math.min(Math.max(8,x-w/2), document.documentElement.clientWidth-w-8);
  pop.style.left=sx+"px"; pop.style.top=(y+14)+"px";
  update();
  pop.querySelector("input")?.focus({preventScroll:true});
}
const closePop=()=>{ const p=$("#pop"); if (!p.hidden){ p.hidden=true; p.innerHTML=""; } };

$("#logo").src=LOGO;
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-layout]"); if (b) show(b.dataset.layout); });
$("#mkdef").onclick=()=>{ store.set(K_LAY,current); renderTabs(); };
$("#xlbtn").onclick=e=>{ const on=document.body.classList.toggle("xl"); e.currentTarget.setAttribute("aria-pressed",on); };
$("#reset").onclick=()=>{ if (!confirm("Put every input back to the values saved in 601102_R5.xlsx?")) return; state={...DEFAULTS}; for (const k in bad) delete bad[k]; save(); update(); };
$("#printb").onclick=()=>print();

document.addEventListener("input",e=>{
  const el=e.target.closest("[data-k]"); if (!el) return;
  const k=el.dataset.k;
  if (!IN[k]){ state[k]=el.value; save(); return; }
  if (el.type==="range"){ setVal(k, el.value); return; }
  const v=parseLen(el.value);
  if (v===""){ delete bad[k]; state[k]=""; }
  else if (isNaN(v)) bad[k]=el.value;
  else { delete bad[k]; state[k]=String(r2(v)); }
  save(); update();
});
document.addEventListener("focusout",e=>{ const el=e.target; if (el.matches?.("input[data-k]") && IN[el.dataset.k]) setTimeout(()=>{ if (bad[el.dataset.k]==null) update(); }); });
document.addEventListener("focusin",e=>{ const el=e.target.closest?.("[data-k],[data-fld]"); if (el){ const k=el.dataset.k||el.dataset.fld; if (IN[k]) setHL(k); } });
document.addEventListener("keydown",e=>{
  const el=e.target;
  if (e.key==="Escape") closePop();
  if (el.matches?.("input[data-k]") && IN[el.dataset.k] && (e.key==="ArrowUp"||e.key==="ArrowDown")){ e.preventDefault(); bump(el.dataset.k, (e.key==="ArrowUp"?1:-1)*(e.shiftKey?12:1)); }
  if (el.matches?.("#gbody input") && e.key==="Enter"){ const ins=$$("#gbody input[data-k]"), i=ins.indexOf(el); if (i<ins.length-1) ins[i+1].focus(); else goG(gstep+1); }
});
function bump(k, mult){ const step=IN[k].u==="lb"?10:1, v=(parseFloat(state[k])||0)+mult*step; setVal(k, r2(Math.max(0,v))); }
document.addEventListener("click",e=>{
  const t=e.target;
  const pop=$("#pop"); if (!pop.hidden && !t.closest("#pop") && !t.closest("[data-vcanvas]")) closePop();
  if (t.closest("[data-popx]")) return closePop();
  const st=t.closest("[data-step]"); if (st) return bump(st.dataset.k2, +st.dataset.step*(e.shiftKey?12:1));
  const ap=t.closest("[data-apply]"); if (ap){ setVal(ap.dataset.apply, ap.dataset.val); setHL(ap.dataset.apply); return; }
  const go=t.closest("[data-go]"); if (go){ if (current==="guided"){ const i=GSTEPS.findIndex(s=>s.cells.includes(go.dataset.go)); if (i>=0) goG(i); } if (!focusCell(go.dataset.go)) openPop(go.dataset.go, e.pageX, e.pageY); return; }
  const fc=t.closest("[data-focus]"); if (fc){ const cell=fc.dataset.focus; if (!cell){ $("[data-probs]")?.scrollIntoView({block:"start",behavior:"smooth"}); return; } setHL(cell); if (IN[cell]) { if (!focusCell(cell)) openPop(cell,e.pageX,e.pageY); } else { const r=$(`#view [data-res="${cell}"],#view [data-kr="${cell}"],#view [data-st="${cell}"]`); r?.scrollIntoView({block:"center",behavior:"smooth"}); } return; }
  const how=t.closest("[data-how]"); if (how){ how.closest(".res").classList.toggle("open"); return; }
  if (t.closest("[data-print]")) return print();
  const ch=t.closest("[data-change]"); if (ch){ const i=GSTEPS.findIndex(s=>s.cells.includes(ch.dataset.change)); goG(i); setTimeout(()=>focusCell(ch.dataset.change),50); return; }
  const gs=t.closest("[data-gstep]"); if (gs) return goG(+gs.dataset.gstep);
  const gn=t.closest("[data-gnav]"); if (gn) return goG(gstep + +gn.dataset.gnav);
  const vs=t.closest("[data-vstep]"); if (vs){ const i=DSTYLES.findIndex(d=>d.id===DV.style); DV.style=DSTYLES[(i+ +vs.dataset.vstep+DSTYLES.length)%DSTYLES.length].id; return paintViewers(); }
  const vset=t.closest("[data-vset]"); if (vset){ DV.style=vset.dataset.vset; return paintViewers(); }
  if (t.closest("[data-vdef]")){ store.set(K_STYLE, DV.style); return paintViewers(); }
  const vp=t.closest("[data-vpos]"); if (vp){ if (DV.raf){ cancelAnimationFrame(DV.raf); DV.raf=0; } DV.f=null; DV.pos=vp.dataset.vpos; return paintViewers(); }
  if (t.closest("[data-vplay]")) return ride();
  if (t.closest("[data-snapreset]")){ if (SNAP){ for (const k of IN_ORDER) state[k]=SNAP[k]; for (const k in bad) delete bad[k]; save(); update(); } return; }
  if (t.closest("[data-snapnew]")){ SNAP={...state}; update(); return; }
  const dc=t.closest("[data-vcanvas] [data-cell]");
  if (dc){ const cell=dc.dataset.cell; if (!cell) return; setHL(cell);
    if (current==="drawing"){ SEL=cell; renderSel(); return; }
    if (IN[cell] && focusCell(cell)) return;
    openPop(cell, e.pageX, e.pageY); return; }
  const kr=t.closest("[data-kr],[data-st]"); if (kr){ const cell=kr.dataset.kr||kr.dataset.st; openPop(cell, e.pageX, e.pageY); return; }
});
document.addEventListener("mouseover",e=>{
  const el=e.target.closest?.("[data-cell]"); if (!el) return;
  setHL(el.dataset.cell||null);
});
document.addEventListener("mouseout",e=>{ if (!e.relatedTarget || !e.relatedTarget.closest?.("[data-cell]")){ const a=document.activeElement; setHL(a?.dataset?.k && IN[a.dataset.k] ? a.dataset.k : null); } });
let rsz; window.addEventListener("resize",()=>{ clearTimeout(rsz); rsz=setTimeout(paintViewers,120); });
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if (id!==current && V[id]) show(id); });
show(location.hash.slice(1) || getDefault());

</script>
