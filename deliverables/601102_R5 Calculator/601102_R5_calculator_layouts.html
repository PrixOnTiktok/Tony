<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T601 Car Frame Calculator</title>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#16191d; --muted:#5d6773; --line:#e1e4e8; --line2:#cfd4da;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --input:#effae9; --input-line:#94c77c;
  --calc:#fff6df; --calc-line:#eec55a; --ok:#1d7a3e; --ok-soft:#e3f4e8;
  --bad:#b42318; --bad-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff2cc;
  --steel:#6b7785; --jack:#2f6fd6; --piston:#8db7f2; --brass:#a8742a; --orange:#e8590c;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --bp:#0d2a4a; --bp2:#123a63; --bp-ink:#dbe9ff; --bp-muted:#8fb3e0; --bp-line:rgba(160,200,255,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --muted:#9aa5b1; --line:#2c323a; --line2:#3a424c;
  --accent:#6ea2f0; --accent-soft:#1c2a40; --input:#17271a; --input-line:#3f7a46;
  --calc:#2a2414; --calc-line:#7a6326; --ok:#5fd08a; --ok-soft:#15291c;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c14e; --warn-soft:#33290f;
  --steel:#8d99a8; --jack:#5a92ea; --piston:#2f5590; --brass:#c9944a;
}}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --muted:#9aa5b1; --line:#2c323a; --line2:#3a424c;
  --accent:#6ea2f0; --accent-soft:#1c2a40; --input:#17271a; --input-line:#3f7a46;
  --calc:#2a2414; --calc-line:#7a6326; --ok:#5fd08a; --ok-soft:#15291c;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c14e; --warn-soft:#33290f;
  --steel:#8d99a8; --jack:#5a92ea; --piston:#2f5590; --brass:#c9944a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
button{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
code,.mono{font-family:var(--mono)}

/* ---------- app header ---------- */
header.app{display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.brand{display:flex;gap:12px;align-items:center}
.brand img{height:48px;background:#fff;border-radius:8px;padding:2px}
.co{font-size:12px;color:var(--muted);line-height:1.35} .co b{display:block;color:var(--ink);font-size:14px}
.ttl{flex:1;min-width:200px} .ttl h1{margin:0;font-size:19px;letter-spacing:.2px} .ttl .rev{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
nav.layouts{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tabs button{border:0;background:transparent;white-space:nowrap;padding:6px 10px;border-radius:7px;display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:600}
.tabs button .n{font:600 11px var(--mono);opacity:.6}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button[aria-selected="true"] .n{opacity:.8}
.tabs .star{color:#f0a400;font-size:12px}
.tabs button[aria-selected="true"] .star{color:#ffe08a}
.mkdef{font-size:12.5px}
.mkdef.is{color:var(--ok);border-color:var(--ok);background:var(--ok-soft);cursor:default}
#laydesc{margin:0 0 12px;font-size:12.5px;color:var(--muted)}

/* ---------- shared atoms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:2px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cr{font:11px var(--mono);text-transform:none;letter-spacing:0;color:var(--muted)}
.tag{font:700 13px var(--mono);text-align:center;border-radius:6px;padding:3px 0;background:var(--accent-soft);color:var(--accent);min-width:34px;display:inline-block}
.tag.none{background:transparent;color:var(--muted)}
input.num{width:96px;text-align:right;font:600 15px var(--mono);padding:5px 8px;border-radius:8px;border:1px solid var(--input-line);background:var(--input);color:var(--ink)}
input.txt{font:600 14px system-ui,sans-serif;padding:5px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);width:100%}
.unit{font-size:12px;color:var(--muted)}
.o.neg,b.neg{color:var(--bad)}
.w{display:block;font-size:12px;font-weight:600;color:var(--bad)}
.w.soft{color:var(--warn)}
.w small{font-weight:400;opacity:.85}
.f{display:none;font:11px var(--mono);color:var(--accent);word-break:break-all;margin-top:2px}
body.formulas .f{display:block}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.alerts{display:grid;gap:6px;margin-bottom:12px}
.alert{border-radius:10px;padding:8px 12px;font-weight:600;border:1px solid;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.alert.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.alert .src{font:11px var(--mono);opacity:.75;font-weight:400}
.alert .why{flex-basis:100%;font-weight:400;font-size:12px;opacity:.9}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.meta>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.meta small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.meta strong{font-weight:700}
.meta input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-top:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.m{font-family:var(--mono)} td.fx{font-family:var(--mono);font-size:11px;color:var(--accent);word-break:break-all}
tr.sel td{background:var(--ok-soft);font-weight:700}
.note{font-size:12px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600;margin:6px 0}
.dia{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.chip rect{fill:#1f5fbf;opacity:.92} .chip text{fill:#fff;font:700 15px ui-monospace,Consolas,monospace}
.chip.in rect{fill:#2e8b3a}
.chip.on rect{fill:var(--orange);opacity:1}
.cap{font-size:12px;color:var(--muted);margin:6px 0 0}
.hl{background:var(--accent-soft)!important}

/* ---------- 1 · classic ---------- */
.cl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;align-items:start}
.cl-side{position:sticky;top:12px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);border-radius:6px}
.card h2+.row,.jackmodel+.row{border-top:0}
.row .lbl{min-width:0} .row .t{font-weight:600} .row .h{display:block;font-size:12px;color:var(--muted)}
.row .cell{font:11px var(--mono);color:var(--muted)}
.row .inp{display:flex;align-items:center;gap:6px} .row .inp .unit{min-width:26px}
.row .w{grid-column:2/-1}
.val{text-align:right;white-space:nowrap}
.val b{font:700 16px var(--mono);background:var(--calc);border:1px solid var(--calc-line);border-radius:8px;padding:3px 8px;display:inline-block;min-width:84px}
.val .unit{display:inline-block;min-width:26px;text-align:left}
.val small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.jackmodel{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-weight:700;margin-bottom:6px}

/* ---------- 2 · blueprint ---------- */
.bp{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:16px;align-items:start;background:var(--bp);background-image:linear-gradient(var(--bp-line) 1px,transparent 1px),linear-gradient(90deg,var(--bp-line) 1px,transparent 1px);background-size:24px 24px;border-radius:14px;padding:16px;color:var(--bp-ink)}
.bp-stage{position:relative;container-type:inline-size;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.bp-stage img{display:block;width:100%;height:auto}
.bp-in,.bp-out{position:absolute;display:flex;align-items:center;gap:.5cqw;border-radius:1.2cqw;font-family:var(--mono);font-weight:700;white-space:nowrap}
.bp-in{background:#2e8b3a;padding:.4cqw .5cqw .4cqw .9cqw;color:#fff;font-size:2.4cqw;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bp-in input{width:11cqw;font:700 2.5cqw var(--mono);text-align:right;border:0;border-radius:.8cqw;padding:.3cqw .6cqw;background:#fff;color:#111}
.bp-in.bad{background:var(--orange)}
.bp-out{background:#1f5fbf;color:#fff;font-size:2.5cqw;padding:.5cqw 1cqw;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.bp-out .o{font-weight:700}
.bp-out.neg,.bp-out.on{background:var(--orange)}
.bp-side h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--bp-muted);margin:0 0 8px;font-weight:700}
.bp-box{border:1px solid rgba(160,200,255,.35);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:rgba(13,42,74,.7)}
.bp-title{font:700 18px var(--mono);letter-spacing:.5px}
.bp-sub{font-size:12px;color:var(--bp-muted)}
.bp-kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.bp-kv .k{font:700 12px var(--mono);color:var(--bp-muted);min-width:24px}
.bp-kv .v{font:700 14px var(--mono);text-align:right;white-space:nowrap}
.bp-kv input.num{width:92px;background:#fff;color:#111;border:0}
.bp-kv .w{grid-column:1/-1;color:#ffb4a8}
.bp-kv .w.soft{color:#ffd77a}
.bp .alert.ok{background:rgba(29,122,62,.25);color:#9ff0b8;border-color:#4fc07a}
.bp .alert.bad{background:rgba(180,35,24,.3);color:#ffc2bb;border-color:#ff7a6e}
.bp .alert.warn{background:rgba(154,103,0,.3);color:#ffe08a;border-color:#e0b040}
.bp .meta>div{background:rgba(13,42,74,.7);border-color:rgba(160,200,255,.35)}
.bp .meta small{color:var(--bp-muted)} .bp .meta input{color:var(--bp-ink)}
.bp .unit{color:var(--bp-muted)}
.bp details.bp-box>summary{margin:0;color:var(--bp-ink)}
.bp-out b{font-weight:700;opacity:.85;margin-right:.6cqw}
.bp-legend{font-size:12px;color:var(--bp-muted);margin:8px 2px 0}
.bp-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}

/* ---------- 3 · step-by-step ---------- */
.wz{max-width:980px;margin:0 auto}
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px;overflow-x:auto}
.stepper li{flex:1;min-width:max-content}
.stepper button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--muted)}
.stepper .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font:700 12px var(--mono);flex:none}
.stepper button[aria-current="step"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.stepper button[aria-current="step"] .sn{background:var(--accent);color:#fff}
.stepper .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;background:var(--ok)}
.stepper .dot.bad{background:var(--bad)} .stepper .dot.na{background:transparent}
.wz-body{padding:18px 20px}
.wz-body h2.wz-h{font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 4px;display:block}
.wz-lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.wz-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.wf{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.wf:first-child{border-top:0}
.wf .wt{font-weight:600;font-size:15px} .wf .wt small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.wf .inp{display:flex;gap:6px;align-items:center}
.wf input.num{width:120px;font-size:18px;padding:8px 10px}
.wf .w{grid-column:2/-1}
.wz-live{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wz-live h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:13px} .kv .k .tag{font-size:11px;min-width:26px;padding:1px 0;margin-right:6px}
.kv .v{font:700 15px var(--mono);white-space:nowrap;text-align:right}
.kv .v .unit{font-family:system-ui,sans-serif;font-weight:400}
.wz-explain{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.wz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wz-nav button{padding:9px 18px;font-size:14px}
.wz-count{color:var(--muted);font-size:12.5px}
.wz-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.wz-res section{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.wz-res h3{margin:2px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.chk{margin:0;padding-left:18px;color:var(--muted);font-size:13px;columns:2;column-gap:24px}

/* ---------- 4 · dashboard ---------- */
.db-in .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.dbf{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:2px 8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.dbf .tag{grid-row:1/3;font-size:12px;min-width:30px}
.dbf .t{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbf .inp{display:flex;gap:4px;align-items:center}
.dbf input.num{width:100%;min-width:0;font-size:14px;padding:3px 6px}
.dbf .w{grid-column:1/-1;font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.tile{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile.w6{grid-column:span 6} .tile.w3{grid-column:span 3}
.tile h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.tile h3 .pill{text-transform:none;letter-spacing:0;line-height:1.5}
.big{font:700 30px/1.15 var(--mono);letter-spacing:-.5px}
.big .unit{font:400 14px system-ui,sans-serif;letter-spacing:0;margin-left:4px}
.big-t{font:700 20px/1.25 system-ui,sans-serif}
.sub{font-size:12px;color:var(--muted)}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--line);margin:10px 0 4px;overflow:visible}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.gauge.bad i{background:var(--bad)}
.gauge em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.gscale{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:10px 0 4px;font:600 11px var(--mono);color:#fff}
.stack span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
.stack .d{background:#7a8594}.stack .e{background:var(--accent)}.stack .g{background:#2e8b3a}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 8px;font-size:13px;margin-top:8px;align-items:baseline}
.mini .tag{font-size:11px;min-width:26px;padding:1px 0}
.mini b{font:700 13.5px var(--mono);text-align:right;white-space:nowrap}

/* ---------- 5 · sheet ---------- */
.sh{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sh-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-bottom:1px solid var(--line)}
.sh-top>div{padding:8px 12px;border-right:1px solid var(--line);min-width:0}
.sh-top small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sh-top strong,.sh-top input{font:700 14px var(--mono)}
.sh-top input{border:0;background:transparent;color:var(--ink);width:100%;padding:0}
.sh-scroll{overflow-x:auto}
.sh table{font-size:13px;min-width:760px}
.sh td,.sh th{padding:4px 8px;border-top:1px solid var(--line)}
.sh tr.sec td{background:var(--bg);font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px}
.sh td.ref{font:700 12.5px var(--mono);color:var(--accent);width:48px;white-space:nowrap}
.sh td.v{width:120px;text-align:right;font:700 13.5px var(--mono);background:var(--calc);border-left:1px solid var(--calc-line);border-right:1px solid var(--calc-line)}
.sh td.v.in{background:var(--input);border-color:var(--input-line);padding:2px}
.sh td.v.in input{width:100%;border:0;background:transparent;text-align:right;font:700 13.5px var(--mono);color:var(--ink);padding:3px 6px}
.sh td.u{width:40px;color:var(--muted)}
.sh td.c{font:11.5px var(--mono);color:var(--muted);width:56px}
.sh td.fx{max-width:360px}
.sh td.desc .w,.sh td.desc .sn{display:block}
.sh .sn{color:var(--bad);font-weight:700;font-size:12px}
.sh .pad{padding:10px 14px}
.sh .alerts{margin:10px 14px}
.sh h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 4px}

/* ---------- 6 · elevation ---------- */
.ev{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.evf{padding:8px 0;border-top:1px solid var(--line)}
.evf:first-of-type{border-top:0}
.evf .top{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center}
.evf .t{font-weight:600;font-size:13px;line-height:1.25} .evf .t small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.evf .inp{display:flex;gap:4px;align-items:center}
.evf input.num{width:80px;font-size:13.5px;padding:3px 6px}
.evf input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent)}
.ev-draw{position:sticky;top:12px}
.ev-svg{width:100%;height:auto;display:block;max-height:calc(100vh - 220px);min-height:420px}
.ev-svg text{font:11px var(--mono);fill:var(--ink)}
.ev-svg .lbl{font:700 11.5px var(--mono)}
.ev-svg .mut{fill:var(--muted)}

const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const num = (v,dp=2) => {
  if (typeof v!=="number" || !isFinite(v)) return (v===""||v==null) ? "—" : String(v);
  if (Math.abs(v) < .5*Math.pow(10,-dp)) v = 0;
  return v.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
};
const short = v => num(v,2).replace(/\.00$/,"");

/* ---------------- state ---------------- */
const KEY="ols601102", KEY_DEF="ols601102.defaultLayout", KEY_STEP="ols601102.step";
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let state = {...DEFAULTS};
try { Object.assign(state, JSON.parse(store.get(KEY)||"{}")); } catch {}
const save = () => store.set(KEY, JSON.stringify(state));
let C = {};

function compute(){
  const inp = {};
  for (const k of IN_ORDER) inp[k] = parseFloat(state[k]) || 0;
  const c = calc(inp); c.K71 = 3;
  return c;
}
function invalids(){
  const out = [];
  for (const [cell,r] of Object.entries(RULES)){
    const raw = state[cell]; if (raw==="" || raw==null) continue; // Excel validation ignores empty cells
    if (r.test(parseFloat(raw)||0)) out.push({cell, ...r});
  }
  return out;
}
function checks(c){
  const sheet = [];
  if (c.A9) sheet.push({t:c.A9, src:"A9"});
  if (c.A13) sheet.push({t:`${c.A13} ${num(c.L13,2)} ${c.M13}`, src:"A13 · L13 · M13"});
  if (c.A14) sheet.push({t:c.A14, src:"A14"});
  if (c.J20) sheet.push({t:`${c.L20}: ${num(c.J20,2)} ${c.K20}`, src:"J20 · K20 · L20"});
  if (c.J24) sheet.push({t:c.J24, src:"J24"});
  if (c.J27) sheet.push({t:c.J27, src:"J27"});
  const inval = invalids();
  const notes = [];
  if (c.E21>0 && c.E61===0){
    notes.push(c.B71>252
      ? `Required stroke ${num(c.B71)}″ is longer than the largest standard stroke (252″), so the sheet selects no jack (Q = 0) and the jack results are not usable.`
      : c.B71===67 ? `Required stroke is exactly 67″. The sheet's 67″ test uses “<” instead of “≤”, so no jack is selected (Q = 0). Change A, B or E slightly.`
      : `No standard stroke matched the required ${num(c.B71)}″ (Q = 0).`);
  }
  return {sheet, inval, notes, ok: !sheet.length && !inval.length && !notes.length};
}
function alertsHTML(c){
  const k = checks(c), h = [];
  for (const a of k.sheet) h.push(`<div class="alert bad">${esc(a.t)}<span class="src">${a.src}</span></div>`);
  for (const v of k.inval) h.push(`<div class="alert ${v.hard?"bad":"warn"}">${IN[v.cell].tag}: ${esc(v.msg)}<span class="src">${v.cell} · ${v.hard?"Excel rejects this entry":"note stored in sheet, not enforced"}</span></div>`);
  for (const n of k.notes) h.push(`<div class="alert warn">${esc(n)}<span class="src">calculator note — the sheet shows no warning</span></div>`);
  return h.length ? h.join("") : `<div class="alert ok">All sheet checks pass — no overhead, pit depth, weight or missing-input warnings.</div>`;
}

/* ---------------- shared update ---------------- */
let CUR = null;
function update(){
  const c = C = compute();
  for (const el of $$("[data-k]")){
    if (el === document.activeElement) continue;
    const v = state[el.dataset.k] ?? "";
    if (el.type==="range") el.value = v==="" ? el.min : v;
    else if (el.value !== String(v)) el.value = v;
  }
  for (const el of $$("[data-out]")){
    const cell = el.dataset.out, v = c[cell];
    el.textContent = num(v, el.dataset.dp!=null ? +el.dataset.dp : dpOf(cell));
    el.classList.toggle("neg", typeof v==="number" && v<0);
  }
  for (const el of $$("[data-ft]")) el.textContent = unitOf(el.dataset.ft)==="in." ? ftin(c[el.dataset.ft]) : "";
  for (const el of $$("[data-text]")){ const v = c[el.dataset.text]; el.textContent = (v===""||v==null) ? (el.dataset.empty ?? "—") : v; }
  const bad = Object.fromEntries(invalids().map(v=>[v.cell,v]));
  for (const el of $$("[data-warn]")){
    const v = bad[el.dataset.warn]; el.hidden = !v;
    el.className = "w" + (v && !v.hard ? " soft" : "");
    el.innerHTML = v ? `⚠ ${esc(v.msg)} <small>(${v.hard?"Excel rejects this entry":"note in sheet, not enforced"})</small>` : "";
  }
  for (const el of $$("[data-pill]")){ const ok = c[el.dataset.pill]>=6; el.className = "pill "+(ok?"ok":"bad"); el.textContent = ok ? "OK ≥ 6″" : "Below 6″ min"; }
  for (const el of $$("[data-alerts]")) el.innerHTML = alertsHTML(c);
  for (const el of $$("[data-date]")) el.textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"2-digit",year:"numeric"});
  for (const g of $$("[data-chip]")){
    const k = g.dataset.chip, cell = DIA[k], [x,y] = CHIP_POS[k], t = g.querySelector("text");
    t.textContent = short(c[cell]) + "″";
    const w = t.textContent.length*9.05 + 10;
    g.querySelector("rect").setAttribute("width", w);
    g.setAttribute("transform", `translate(${Math.min(x, 567-w)},${y})`);
  }
  for (const el of $$("[data-strokes]")) el.innerHTML = strokesRows(c);
  for (const el of $$("[data-helpers]")) el.innerHTML = helperRows(c);
  CUR?.update?.(c);
}

  build: () => `<div class="wz">

  </div>`,
  after(root){
    root.addEventListener("click", e => {
      const s = e.target.closest("[data-step]"), g = e.target.closest("[data-go]");
      if (s) goStep(+s.dataset.step);
      else if (g) goStep(step + +g.dataset.go);
    });
    root.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.matches("input")){ const ins=$$("#wzbody input"); const i=ins.indexOf(e.target); if (i<ins.length-1) ins[i+1].focus(); else goStep(step+1); } });
    renderStep();
  },
  update(c){
    const bad = new Set(invalids().filter(v=>v.hard).map(v=>v.cell));
    STEPS.forEach((s,i)=>{
      const dot = $(`[data-stepdot="${i}"]`); if (!dot) return;
      let st = "na";
      if (s.fields.length) st = s.fields.some(f=>bad.has(f) || state[f]==="" || state[f]==null) ? "bad" : "";
      if (i===STEPS.length-1) st = checks(c).ok ? "" : "bad";
      dot.className = "dot " + st;
    });
    const p = $("[data-pitchk]"); if (p) p.innerHTML = c.J20!=="" ? `<span class="pill bad">Too shallow</span>` : `<span class="pill ok">OK</span>`;
    const w = $("[data-wsum]"); if (w){ const s=c.E26+c.E27; w.innerHTML = `${num(s,0)} <span class="unit">lb</span> <span class="pill ${s>1679?"bad":"ok"}">${s>1679?"Over":"OK"}</span>`; }
  }
};
function goStep(i){ step = Math.min(STEPS.length-1, Math.max(0,i)); store.set(KEY_STEP, step); renderStep(); }
function renderStep(){
  $("#wzbody").innerHTML = STEP_BODY[step]();
  $$(".stepper [data-step]").forEach(b => { if (+b.dataset.step===step) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  $("[data-go='-1']").disabled = step===0;
  const last = step===STEPS.length-1, nx = $("#wznext");
  nx.textContent = last ? "Print results" : (step===STEPS.length-2 ? "See results →" : "Next →");
  if (last) delete nx.dataset.go; else nx.dataset.go = "1";
  nx.onclick = last ? () => print() : null;
  $("#wzcount").textContent = `Step ${step+1} of ${STEPS.length}`;
  update();
}

      <h3>Data validation stored in the sheet</h3>
      <div style="overflow-x:auto"><table><thead><tr><th>Cell</th><th>Rule</th><th>Message (verbatim)</th><th>Effect</th></tr></thead><tbody>
        <tr><td class="m">E18</td><td>whole number ≥ 3</td><td>MINIMUM TOP OVER TRAVEL IS 3.00"</td><td>Excel rejects</td></tr>
        <tr><td class="m">E19</td><td>any value</td><td>MINIMUM PLATFORM THICKNESS 1.00"</td><td>Not enforced — shown here as a note</td></tr>
        <tr><td class="m">E20</td><td>decimal ≥ 8</td><td>MINIMUM PIT DEPTH 8.00"</td><td>Excel rejects</td></tr>
        <tr><td class="m">E21</td><td>any value</td><td>MAXIMUM TRAVEL 498.00" / MINIMUM TRAVEL 75.00"</td><td>Not enforced — shown here as a note</td></tr>
        <tr><td class="m">E23</td><td>decimal ≤ 99</td><td>MAXIMUM CAB HEIGHT 99.00" / MINIMUM CAB HEIGHT 82.00"</td><td>Excel rejects only above 99 (the 82″ minimum is in the message, not the rule)</td></tr>
        <tr><td class="m">F18 · F20 · F21 · E28</td><td>≥ 4 · 9–24 · 75–498 · ≥ 1</td><td>Leftover rules on empty cells</td><td>No effect</td></tr>
      </tbody></table></div>
      <h3>Quirks kept exactly as the sheet has them</h3>
      <ul class="note">
        <li>The 41″ stroke (A73) has no formula next to it, so it is never selected.</li>
        <li>The 67″ test (E75) uses “&lt;” while the others use “≤”: a required stroke of exactly 67″ selects nothing (Q = 0).</li>
        <li>J24's “INVALID OVERHEAD HEIGHT” warning points at K80, which is empty, so it never shows.</li>
        <li>The missing-input check (N77) ignores X (E23), H (E25) and W1 (E26).</li>
      </ul>
    </div>
  </div>`,
  update(c){
    const notes = {E20: c.J20!=="" ? `${num(c.J20,2)} ${c.K20} ${c.L20}` : "", E24: c.J24, E27: c.J27};
    for (const el of $$("[data-sheetnote]")) el.textContent = notes[el.dataset.sheetnote] || "";
  }
};

/* 6 · Elevation */
const evf = cell => `<div class="evf" data-cell="${cell}"><label class="top"><span class="tag">${IN[cell].tag}</span><span class="t">${IN[cell].t}<small>${hintOf(cell)}</small></span><span class="inp">${numIn(cell)}<span class="unit">${unitOf(cell)}</span></span></label>${rangeIn(cell)}${warnSlot(cell)}</div>`;
V.elevation = {
  build: () => `<section class="alerts" data-alerts aria-live="polite"></section><div class="ev">
    <section class="card"><h2>Inputs <span class="cr">drag or type</span></h2>${IN_ORDER.map(evf).join("")}
      <section class="meta" style="margin:10px 0 0;grid-template-columns:1fr 1fr">${jobFields()}</section></section>
    <section class="card ev-draw"><h2>Hoistway section, to scale <span class="cr">${tx("J6")}</span></h2>
      <svg class="ev-svg" id="evsvg" viewBox="0 0 600 760" role="img" aria-label="Scaled hoistway section"></svg>
      <div class="ev-strip">
        <div style="grid-column:span 2"><small>Jack</small><b style="font-size:12px">${tx("A57")}</b></div>
        <div><small>Q stroke selected</small><b>${o("E61",0)}″</b></div>
        <div><small>T sheave clearance</small><b>${o("E31")}″</b> <span data-pill="E31"></span></div>
        <div><small>T2 cab clearance</small><b>${o("E33")}″</b> <span data-pill="E33"></span></div>
        <div><small>Rail length</small><b>${o("E49")}″</b></div>
        <div><small>Rail brackets</small><b>${o("E51")}</b></div>
        <div><small>Rope length × 2</small><b>${o("E53")}″</b></div>
      </div>
      <p class="cap">Right side, from the pit floor up: pillar M + collapsed jack R + stroke Q + 15″ sheave + clearance T = total hoistway N — the same sum the sheet uses for T. The rail runs to 5″ above the sheave.</p>
    </section></div>`,
  update(c){ const s=$("#evsvg"); if (s) s.innerHTML = elevationSVG(c); }
};
function placeLabels(arr, gap=14){ // arr: {y}; push apart vertically, bottom-up
  const s = [...arr].sort((a,b)=>b.y-a.y);
  for (let i=1;i<s.length;i++) if (s[i].ly > s[i-1].ly - gap) s[i].ly = s[i-1].ly - gap;
  return arr;
}
function elevationSVG(c){
  const W=600, H=760, TOP=30, BOT=40;
  if (!(c.E21>0)) return `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="mut">Enter travel (E) to draw the section</text>`;
  const cl = v => Math.max(0, +v||0);
  const D=cl(c.E20), E=cl(c.E21), G=cl(c.E24), C_=cl(c.E19), F=cl(c.E22);
  const N=D+E+G, M=cl(c.E41), R=cl(c.E63), SQ=cl(c.E59), S=cl(c.E65), SH=15;
  const jTop=M+R+SQ+S, shTop=jTop+SH, rail=cl(c.E49);
  const cabBot=Math.max(0,D-C_), cabTop=cabBot+F;
  const maxV=Math.max(N, shTop, rail, cabTop, 1);
  const k=(H-TOP-BOT)/maxV, y=v=>H-BOT-v*k;
  const neg = ["E20","E21","E24","E41","E63","E59","E65","E19","E22"].filter(x=>c[x]<0);
  const xL=150, xR=520, jx=440, dimR=548, dimL=94, cx=xL+60, cw=130;
  let g = "";
  // concrete: pit floor, back wall, ceiling, landings
  g += `<rect style="fill:var(--line2)" x="${xL-30}" y="${y(0)}" width="${xR-xL+46}" height="12"/>`;
  g += `<rect style="fill:var(--line2)" x="${xR}" y="${y(N)}" width="16" height="${y(0)-y(N)}"/>`;
  g += `<rect style="fill:var(--line2)" x="${xL}" y="${y(N)-12}" width="${xR-xL+16}" height="12"/>`;
  g += `<line style="stroke:var(--ink)" x1="${xL}" y1="${y(N)}" x2="${xR}" y2="${y(N)}" stroke-width="1.5"/><text x="${xL+4}" y="${y(N)-16}" class="mut">Ceiling</text>`;
  for (const [v,l] of [[D,"Bottom floor"],[D+E,"Top floor"]]){
    g += `<rect style="fill:var(--line2)" x="${xL-40}" y="${y(v)}" width="40" height="9"/><line style="stroke:var(--muted)" x1="${xL-40}" y1="${y(v)}" x2="${xR}" y2="${y(v)}" stroke-dasharray="4 4"/><text x="${xL-40}" y="${y(v)-4}" class="mut">${l}</text>`;
  }
  g += `<line style="stroke:var(--ink)" x1="${xL}" y1="${y(0)}" x2="${xL}" y2="${y(D)}" stroke-width="1.5"/>`;
  // cab at the bottom floor
  if (F>0){
    g += `<rect style="fill:var(--accent-soft);stroke:var(--accent)" x="${cx}" y="${y(cabTop)}" width="${cw}" height="${y(cabBot)-y(cabTop)}" rx="3" stroke-width="1.5"/>`;
    g += `<rect style="fill:var(--brass)" x="${cx-6}" y="${y(cabBot)-5}" width="${jx-cx+6}" height="7"/>`;
    g += `<text style="fill:var(--accent)" x="${cx+cw/2}" y="${(y(cabTop)+y(cabBot))/2}" text-anchor="middle" class="lbl">CAB · F ${short(c.E22)}″</text>`;
    g += `<text x="${cx+cw/2}" y="${(y(cabTop)+y(cabBot))/2+15}" text-anchor="middle" class="mut">at bottom floor</text>`;
  }
  // T2 note in the overhead
  g += `<text x="${xL+12}" y="${y(N)+20}" class="${c.E33<6?"badt":"mut"}">T2 ${short(c.E33)}″ cab overhead clearance</text>`;
  // rail
  g += `<line style="stroke:var(--steel)" x1="${jx+24}" y1="${y(0)}" x2="${jx+24}" y2="${y(rail)}" stroke-width="4"/>`;
  g += `<text transform="translate(${jx+38} ${(y(0)+y(rail))/2}) rotate(-90)" text-anchor="middle" class="mut">rail ${short(c.E49)}″ · ${num(c.E51,0)} brackets</text>`;
  // jack stack
  g += `<rect style="fill:var(--steel)" x="${jx-8}" y="${y(M)}" width="16" height="${y(0)-y(M)}"/>`;
  g += `<rect style="fill:var(--jack)" x="${jx-14}" y="${y(M+R)}" width="28" height="${y(M)-y(M+R)}" rx="3"/>`;
  g += `<rect style="fill:var(--piston);stroke:var(--jack)" x="${jx-7}" y="${y(jTop)}" width="14" height="${y(M+R)-y(jTop)}"/>`;
  if (S>0) g += `<line style="stroke:var(--jack)" x1="${jx-12}" y1="${y(M+R+SQ)}" x2="${jx+12}" y2="${y(M+R+SQ)}" stroke-dasharray="3 2"/>`;
  g += `<rect style="fill:var(--brass)" x="${jx-18}" y="${y(shTop)}" width="36" height="${y(jTop)-y(shTop)}" rx="3"/>`;
  // brackets O and P
  for (const [cell,l] of [["E45","O"],["E47","P"]]){ if (c[cell]>0) g += `<line style="stroke:var(--orange)" x1="${jx-22}" y1="${y(c[cell])}" x2="${jx+28}" y2="${y(c[cell])}" stroke-width="3"/><text style="fill:var(--orange)" x="${jx-26}" y="${y(c[cell])+4}" text-anchor="end" class="lbl">${l} ${short(c[cell])}″</text>`; }
  // dimension chains
  const dimChain = (x, segs, side) => {
    let out = "";
    const labels = segs.map(s => ({...s, y:(y(s.a)+y(s.b))/2, ly:(y(s.a)+y(s.b))/2}));
    placeLabels(labels);
    for (const s of labels){
      const y1=y(s.a), y2=y(s.b), col = s.bad ? "var(--bad)" : "var(--ink)";
      out += `<line style="stroke:${col}" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line style="stroke:${col}" x1="${x-5}" y1="${y1}" x2="${x+5}" y2="${y1}"/><line style="stroke:${col}" x1="${x-5}" y1="${y2}" x2="${x+5}" y2="${y2}"/>`;
      const tx_ = side==="r" ? x+8 : x-8, anchor = side==="r" ? "start" : "end";
      if (Math.abs(s.ly-s.y)>2) out += `<line style="stroke:var(--muted)" x1="${x}" y1="${s.y}" x2="${tx_+(side==="r"?-2:2)}" y2="${s.ly-4}" stroke-width=".7"/>`;
      out += `<text x="${tx_}" y="${s.ly+4}" text-anchor="${anchor}" class="lbl${s.bad?" badt":""}">${s.l} ${s.v}</text>`;
    }
    return out;
  };
  g += dimChain(dimL, [{a:0,b:D,l:"D",v:short(c.E20)+"″"},{a:D,b:D+E,l:"E",v:short(c.E21)+"″"},{a:D+E,b:N,l:"G",v:short(c.E24)+"″"}], "l");
  g += `<line style="stroke:var(--ink)" x1="22" y1="${y(0)}" x2="22" y2="${y(N)}"/><line style="stroke:var(--ink)" x1="16" y1="${y(0)}" x2="28" y2="${y(0)}"/><line style="stroke:var(--ink)" x1="16" y1="${y(N)}" x2="28" y2="${y(N)}"/>`;
  g += `<text transform="translate(16 ${(y(0)+y(N))/2}) rotate(-90)" text-anchor="middle" class="lbl">N ${short(c.E43)}″ total hoistway</text>`;
  const T = c.E31, segs = [{a:0,b:M,l:"M",v:short(c.E41)+"″"},{a:M,b:M+R,l:"R",v:short(c.E63)+"″"},{a:M+R,b:jTop,l:"Q",v:short(c.E61)+"″"},{a:jTop,b:shTop,l:"sheave",v:"15″"}];
  segs.push(T>=0 ? {a:shTop,b:N,l:"T",v:short(T)+"″",bad:T<6} : {a:N,b:shTop,l:"T",v:short(T)+"″",bad:true});
  g += dimChain(dimR, segs, "r");
  if (T<0) g += `<rect style="fill:var(--bad)" x="${jx-20}" y="${y(shTop)}" width="40" height="${y(N)-y(shTop)}" opacity=".25"/><text x="${jx}" y="${y(shTop)-6}" text-anchor="middle" class="badt">sheave above ceiling</text>`;
  if (neg.length) g += `<text x="${W/2}" y="${H-8}" text-anchor="middle" class="badt">Negative value(s) in ${neg.join(", ")} drawn as zero</text>`;
  return g;
}

/* 7 · Report */
const rpIn = cell => `<tr data-cell="${cell}"><td class="r">${IN[cell].tag}</td><td>${IN[cell].t}${IN[cell].dyn?`<br><small style="color:#5a6470">${tx(IN[cell].dyn)}</small>`:""}${warnSlot(cell)}</td><td class="v">${numIn(cell)}</td><td class="u">${unitOf(cell)}</td></tr>`;
const rpOut = cell => `<tr data-cell="${cell}"><td class="r">${OUT[cell].tag}</td><td>${OUT[cell].t}${OUT[cell].h?` <small style="color:#5a6470">· ${esc(OUT[cell].h)}</small>`:""}${OUT[cell].code?`<span data-pill="${cell}"></span>`:""}</td><td class="v">${o(cell)}</td><td class="u">${unitOf(cell)}</td></tr>`;
V.report = {
  build: () => `<div class="rp-bar noprint"><span>Green values are editable — click and type. Print or “Save as PDF” gives just the page.</span><button class="primary" onclick="print()">Print / Save PDF</button></div>
  <article class="paper">
    <header class="rp-head"><img src="${LOGO}" alt="OLS logo"><div><h2>T601 Car Frame Calculations</h2><div class="sub">OLS Inc. · 2 Cochran Drive · Ayr, On Canada, N0B 1E0</div><div class="sub">601102_REV: 5 · Dec 31, 2013</div></div>
      <div class="rp-id">OLS PART No.<br><b>${tx("M4")}</b><br>MODEL<br><b style="font-size:12px">${tx("J6")}</b></div></header>
    <div class="rp-job"><div><small>Job name</small><input data-k="job" aria-label="Job name"></div><div><small>Job no</small><input data-k="jobno" placeholder="—" aria-label="Job number"></div><div><small>Printed</small><b data-date></b></div></div>
    <section class="alerts" data-alerts></section>
    <div class="rp-cols">
      <section><h3>General data</h3><table>${IN_ORDER.map(rpIn).join("")}</table></section>
      <section><h3>Calculations</h3><table>${CALC_ORDER.map(rpOut).join("")}</table></section>
    </div>
    <div class="rp-cols">
      <section><h3>Jack information</h3><p class="rp-jm">${tx("A57")}</p><table>${JACK_ORDER.map(rpOut).join("")}</table></section>
      <section><h3>Hoistway layout</h3><div class="rp-dia">${diagramSVG()}</div></section>
    </div>
    <footer class="rp-foot"><span>Calculated with the 601102_R5 formulas</span><span>${tx("J6")} · ${tx("M4")}</span></footer>
  </article>`
};

/* =============================== shell =============================== */
$("#logo").src = LOGO;
const getDefault = () => { const d = store.get(KEY_DEF); return LAYOUTS.some(l=>l.id===d) ? d : "classic"; };
let current = null;
function renderTabs(){
  const def = getDefault();
  $("#tabs").innerHTML = LAYOUTS.map((l,i)=>`<button role="tab" data-layout="${l.id}" aria-selected="${l.id===current}" title="${esc(l.desc)} (key ${i+1})"><span class="n">${i+1}</span>${l.name}${l.id===def?' <span class="star" aria-label="default">★</span>':""}</button>`).join("");
  const b = $("#mkdef"), L = LAYOUTS.find(l=>l.id===current);
  if (current===def){ b.textContent = "★ Your default layout"; b.className = "mkdef is"; b.disabled = true; }
  else { b.textContent = `☆ Make “${L.name}” my default`; b.className = "mkdef"; b.disabled = false; }
  $("#laydesc").textContent = L.desc;
}
function show(id){
  if (!V[id]) id = getDefault();
  current = id; CUR = V[id];
  document.body.classList.toggle("report", id==="report");
  const view = $("#view");
  view.innerHTML = CUR.build();
  CUR.after?.(view);
  renderTabs();
  if (location.hash.slice(1)!==id) history.replaceState(null, "", "#"+id);
  update();
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-layout]"); if (b) show(b.dataset.layout); });
$("#mkdef").onclick = () => { store.set(KEY_DEF, current); renderTabs(); };
$("#fx").onclick = e => { const on = document.body.classList.toggle("formulas"); e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Hide formulas" : "Show formulas"; };
$("#reset").onclick = () => { if (!confirm("Put every input back to the values saved in 601102_R5.xlsx?")) return; state = {...DEFAULTS}; save(); update(); };
$("#print").onclick = () => print();
document.addEventListener("input", e => { const el = e.target.closest("[data-k]"); if (!el) return; state[el.dataset.k] = el.value; save(); update(); });
document.addEventListener("focusout", e => { if (e.target.matches?.("[data-k]")) setTimeout(update); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = +e.key; if (n>=1 && n<=LAYOUTS.length) show(LAYOUTS[n-1].id);
});
document.addEventListener("mouseover", e => {
  const cell = e.target.closest("[data-cell]")?.dataset.cell;
  for (const g of $$(".chip,.bp-out,.bp-in")) g.classList.toggle("on", !!cell && g.dataset.cell===cell);
  for (const r of $$(".row,.sh tr[data-cell],.paper tr[data-cell]")) r.classList.toggle("hl", !!cell && r.dataset.cell===cell);
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id!==current && V[id]) show(id); });
show(location.hash.slice(1) || getDefault());
</script>
</body>
</html>
